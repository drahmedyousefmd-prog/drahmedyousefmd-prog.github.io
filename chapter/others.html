ion (coeliac)\r\n\r\n[TREATMENT]\r\n- Oral iron is first line for most cases\r\n- Parenteral iron (IV) only if oral fails or not tolerated\r\n- Combine with vitamin C for better absorption\r\n- Avoid concurrent intake with PPIs, tea, milk, or calcium\r\n\r\n[WARNING]\r\nIron overdose is dangerous — keep away from children. Do not exceed recommended dose.\r\nIron stains teeth — use a straw for liquid forms.\r\n\r\n[RX]\r\n- Ferrograd C tab (Ferrous Sulphate + Ascorbic Acid) | قرص واحد يوميًا على معدة فارغة مع كوب ماء | 45 ج.م\r\n- OR Ferrous Sulphate 325mg tab (Ferrous Sulphate) | قرص مرتين إلى 3 مرات يوميًا بعد الأكل | 15 ج.م\r\n- OR Iron sucrose vial (Iron Sucrose) | حقن وريدي حسب تعليمات الطبيب | 85 ج.م\r\n- Vitamin C 500mg tab (Ascorbic Acid) | قرص مرة يوميًا مع الحديد | 12 ج.م\r4:[\"$\",\"div\",null,{\"className\":\"flex min-h-dvh flex-col\",\"style\":{\"background\":\"color-mix(in srgb, #6B6B6B 6%, var(--bg))\"},\"children\":[[\"$\",\"header\",null,{\"className\":\"case-header\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex w-full max-w-[1100px] items-center gap-3 px-4 py-4 sm:px-6\",\"children\":[[\"$\",\"$Le\",null,{\"href\":\"/\",\"className\":\"no-print flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-[var(--border)] bg-[var(--surface)] text-[var(--text-secondary)] transition hover:border-[var(--brand)] hover:text-[var(--brand)]\",\"aria-label\":\"الرئيسية\",\"children\":[\"$\",\"$Lf\",null,{\"ref\":\"$undefined\",\"icon\":{\"name\":\"arrow-left\",\"size\":24,\"node\":[[\"path\",{\"d\":\"m12 19-7-7 7-7\",\"key\":\"1l729n\"}],[\"path\",{\"d\":\"M19 12H5\",\"key\":\"x3x0zl\"}]]},\"className\":\"h-4 w-4\",\"strokeWidth\":2}]}],[\"$\",\"div\",null,{\"className\":\"min-w-0\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"text-[22px] font-extrabold leading-tight text-[var(--text-primary)]\",\"children\":\"Others\"}],[\"$\",\"span\",null,{\"className\":\"mt-1 inline-flex items-center gap-1.5 rounded-full px-2.5 py-0.
