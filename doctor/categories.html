on reduced — take 1 hour apart.\\r\\n\\r\\nStatins + Grapefruit juice (large amounts):\\r\\n⚠️ Increased Atorvastatin levels.\\r\\n\\r\\nEzetimibe + Fibrates:\\r\\n✅ Safe combination — commonly used together for mixed dyslipidemia.\\r\"},{\"id\":\"rochetta-045\",\"title\":\"Diabetes Mellitus\",\"subtitle\":\"Fasting glucose ≥ 126 or HbA1c ≥ 6.5% — metabolic management\",\"content\":\"[DIAGNOSIS]\\r\\n- Fasting glucose ≥ 126 mg/dL (2 readings)\\r\\n- HbA1c ≥ 6.5%\\r\\n- Random glucose ≥ 200 + symptoms\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Lab: FBS, HbA1c (baseline + every 3 months), renal function, urinalysis (microalbuminuria)\\r\\n- Lab: Lipid profile, LFTs (fatty liver), electrolytes — annual screening\\r\\n- Special test: OGTT if diagnosis uncertain; retinal screening (annual); foot exam (monofilament)\\r\\n- Monitor: Home glucose diary, HbA1c target \u003c 7%, weight, BP (\u003c 130/80)\\r\\n\\r\\n[TREATMENT]\\r\\n- Step 1: Metformin 500→1000mg BID + Lifestyle\\r\\n- Step 2: + SGLT2i or GLP-1 RA (if HF/CKD/obesity)\\r\\n- Step 3: + Sulfonylurea or DPP-4i or TZD\\r\\n- Step 4: Add Insulin — start basal (Glargine)\\r\\n- Target HbA1c \u003c 7%\\r\\n\\r\\n[RX]\\r\\n- Metformin 1000mg tab (Metformin HCl) | قرص مرتين يوميًا بعد الأكل — يبدأ بـ 500mg ثم يزاد | 13.5 ج.م\\r\\n- OR Gliclazide 80mg tab (Gliclazide) | قرص مرتين يوميًا قبل الأكل | 9 ج.م\\r\\n- Dapagliflozin 10mg tab (Dapagliflozin) | قرص مرة واحدة يوميًا صباحًا | 186 ج.م\\r\",\"category\":\"Cardiovascular\",\"chapterAr\":\"القلب والأوعية الدموية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Metformin 1000mg tab | 30 ج.م: Glucophage 1000mg tab | 90 ج.م, Metformin Arrow 1000mg tab | 25 ج.م, Metformin GPO 1000mg tab | 22 ج.م\\r\\nGliclazide 80mg tab | 18 ج.م: Diamicron 80mg tab | 55 ج.م, Gliclazide Arrow 80mg tab | 15 ج.م, Gliclazide GPO 80mg tab | 12 ج.م\\r\\nDapagliflozin 10mg tab | 250 ج.م: Forxiga 10mg tab | 450 ج.م, Dapagliflozin Arrow 10mg tab | 220 ج.م, Dapagliflozin Sandoz 10mg tab | 200 ج.م\\r\",\"drugInstructions\":\"⚠️ Metformin: Take WITH food — reduces GI side effects\\r\\n⚠️ Start with 500mg, increase gradually\\r\\n⚠️ Gliclazide: Take BEFORE meals\\r\\n⚠️ Regular blood glucose monitoring — keep a log\\r\\n⚠️ HbA1c target: \u003c7% — check every 3 months\\r\\n⚠️ STOP Metformin 48h before/after contrast dye\\r\\n⚠️ If vomiting/diarrhea — temporarily stop Metformin\\r\\n✅ Dapagliflozin: Take in the morning\\r\\n⚠️ If on SGLT2i: report excessive thirst, frequent urination\\r\\n⚠️ Always carry fast-acting sugar for hypoglycemia\\r\\n❌ Avoid excessive alcohol — lactic acidosis risk\\r\",\"drugInteractions\":\"Metformin + Iodinated contrast media:\\r\\n⚠️ Risk of lactic acidosis. STOP Metformin before contrast and restart 48h after.\\r\\n\\r\\nSulfonylureas (Gliclazide) + Fluconazole:\\r\\n⚠️↑ Hypoglycemia risk. Monitor glucose.\\r\\n\\r\\nInsulin/Sulfonylureas + Beta-blockers (non-selective):\\r\\n⚠️ Masks hypoglycemia symptoms. Glucose monitoring essential.\\r\\n\\r\\nMetformin + Alcohol:\\r\\n⚠️↑ Lactic acidosis risk. Avoid excessive alcohol.\\r\"},{\"id\":\"rochetta-046\",\"title\":\"Thyroid Disorders\",\"subtitle\":\"Hypo- and hyperthyroidism — metabolic regulation\",\"content\":\"[DIAGNOSIS]\\r\\n- Hypothyroidism: Fatigue, weight gain, cold intolerance, TSH elevated\\r\\n- Hyperthyroidism: Weight loss, heat intolerance, tremor, TSH suppressed\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Lab: TSH, free T4, free T3; anti-TPO, anti-TG antibodies (autoimmune)\\r\\n- Imaging: Thyroid ultrasound with scintigraphy (uptake) for thyroiditis vs nodule\\r\\n- ECG: Baseline — tachycardia, atrial fibrillation (hyperthyroid)\\r\\n- Monitor: TSH every 6–8 weeks to dose titrate; FBC on carbimazole (agranulocytosis risk)\\r\\n\\r\\n[TREATMENT]\\r\\n- Hypothyroidism: Levothyroxine — lifelong\\r\\n- Hyperthyroidism: Carbimazole — 12–18 months\\r\\n\\r\\n[WARNING]\\r\\nLevothyroxine: Take on empty stomach, 30–60 min before breakfast. Avoid with calcium/iron supplements (space 4 hours).\\r\\n\\r\\n[RX-الروشتة — Hypothyroidism]\\r\\n- Eltroxin 50mcg tab (Levothyroxine Sodium) | قرص مرة واحدة يوميًا على معدة فارغة صباحًا | 78 ج.م\\r\\n\\r\\n[RX-الروشتة — Hyperthyroidism]\\r\\n- Carbimazole 5mg tab (Carbimazole) | 1-3 قراص يوميًا حسب شدة المرض — 12-18 شهر | 40 ج.م\\r\",\"category\":\"Cardiovascular\",\"chapterAr\":\"القلب والأوعية الدموية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Eltroxin 50mcg tab | 25 ج.م: Synthroid 50mcg tab | 70 ج.م, Levothyroxine Arrow 50mcg tab | 20 ج.م, Levothyroxine GPO 50mcg tab | 15 ج.م\\r\\nCarbimazole 5mg tab | 15 ج.م: Neomercazole 5mg tab | 50 ج.م, Carbimazole Arrow 5mg tab | 12 ج.م, Carbimazole Sandoz 5mg tab | 10 ج.م\\r\",\"drugInstructions\":\"⚠️ Levothyroxine: Take on EMPTY stomach, 30-60 min before breakfast\\r\\n⚠️ Take with plain water only — not coffee, milk, or juice\\r\\n⚠️ Space 4 hours from calcium, iron, PPIs, or antacids\\r\\n⚠️ Consistency is key — same time daily\\r\\n⚠️ Carbimazole: Same time daily\\r\\n⚠️ Regular TSH monitoring every 6-8 weeks until stable\\r\\n⚠️ Report palpitations, weight loss (overtreatment) or fatigue, weight gain (undertreatment)\\r\\n❌ Do NOT stop Carbimazole suddenly\\r\\n⚠️ Report sore throat, fever, mouth ulcers on Carbimazole (blood disorder — rare but serious)\\r\",\"drugInteractions\":\"Levothyroxine + Calcium/Iron supplements/PPIs/Antacids:\\r\\n⚠️↓↓ Reduced absorption. Space 4 hours apart.\\r\\n\\r\\nLevothyroxine + Warfarin:\\r\\n⚠️ May increase Warfarin effect. Monitor INR when adjusting.\\r\"},{\"id\":\"rochetta-047\",\"title\":\"Osteoporosis\",\"subtitle\":\"Reduced bone density — fracture risk in elderly\",\"content\":\"[DIAGNOSIS]\\r\\n- Age \u003e 65, female, postmenopausal\\r\\n- Long-term corticosteroid use\\r\\n- Low BMI, smoking, alcohol\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Imaging: DXA scan (dual-energy X-ray absorptiometry) — T-score ≤ −2.5 = osteoporosis\\r\\n- Lab: Calcium, phosphate, vitamin D (25-OH), renal function, LFTs, testosterone (men)\\r\\n- Special test: FRAX score for fracture risk; vertebral imaging if height loss/back pain\\r\\n- Monitor: Repeat DXA at 2 years, calcium balance, adherence to bisphosphonate\\r\\n\\r\\n[TREATMENT]\\r\\n- Calcium + Vit D: Foundation — all patients\\r\\n- Bisphosphonate: Alendronate 70mg weekly — first-line\\r\\n- Denosumab: If refractory — subcutaneous injection\\r\\n\\r\\n[WARNING]\\r\\nBisphosphonates: Take with full glass of water, remain upright 30 min. Avoid if GFR \u003c 30. Risk of osteonecrosis of jaw (rare).\\r\\n\\r\\n[RX]\\r\\n- Alendronate 70mg tab (Alendronate Sodium) | قص واحدة أسبوعيًا صباحًا على معدة فارغة | 35 ج.م\\r\\n- + Acrocal chewable tab (Calcium + Vit D3) | لبوسة واحدة يوميًا | 49.5 ج.م\\r\",\"category\":\"Cardiovascular\",\"chapterAr\":\"القلب والأوعية الدموية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Alendronate 70mg tab | 120 ج.م: Fosamax 70mg tab | 350 ج.م, Alendronate Arrow 70mg tab | 100 ج.م, Alendronate GPO 70mg tab | 90 ج.م\\r\\nAcrocal chewable tab (Calcium+Vit D3) | 60 ج.م: Caltrate 600+D3 | 100 ج.م, Calcium Sandoz D3 | 80 ج.م, Calcichew D3 | 90 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-048\",\"title\":\"Lower UTI / Cystitis\",\"subtitle\":\"Dysuria, frequency, urgency — most common in women\",\"content\":\"$2a\",\"category\":\"Urinary\",\"chapterAr\":\"المسالك البولية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Nitrofurantoin 100mg tab | 25 ج.م: Macrodantin 100mg tab | 90 ج.م, Nitrofurantoin Arrow 100mg tab | 20 ج.م, Nitrofurantoin GPO 100mg tab | 18 ج.م\\r\\nFosfomycin 3g sachet | 65 ج.م: Monurol 3g sachet | 140 ج.م, Fosfomycin Teva 3g sachet | 55 ج.م, Fosfomycin Sandoz 3g sachet | 50 ج.م\\r\\nPhenazopyridine 100mg tab | 40 ج.م: Pyridium 100mg tab | 95 ج.م, Phenazopyridine GPO 100mg tab | 35 ج.م, AZO 100mg tab | 110 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-049\",\"title\":\"Upper UTI / Pyelonephritis\",\"subtitle\":\"Fever, flank pain, nausea — infection ascending to kidney\",\"content\":\"$2b\",\"category\":\"Urinary\",\"chapterAr\":\"المسالك البولية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Ciprofloxacin 500mg tab | 35 ج.م: Cipro 500mg tab | 90 ج.م, Ciprofloxacin Arrow 500mg tab | 30 ج.م, Ciproxina 500mg tab | 80 ج.م\\r\\nCefuroxime 500mg tab | 55 ج.م: Ceftin 500mg tab | 150 ج.م, Cefuroxime Arrow 500mg tab | 45 ج.م, Cefuroxime GPO 500mg tab | 40 ج.م\\r\\nBrufen 400mg tab | 30 ج.م: Ibuprofen 400mg tab | 15 ج.م, Advil 400mg tab | 35 ج.م, Brufen GPO 400mg tab | 25 ج.م\\r\\nDrotaverine 40mg tab | 12 ج.م: No-Spa 40mg tab | 40 ج.م, Drotaverine Arrow 40mg tab | 10 ج.م, Drotaverine GPO 40mg tab | 8 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-050\",\"title\":\"Renal Colic / Urolithiasis\",\"subtitle\":\"Severe colicky flank pain radiating to groin — kidney stones\",\"content\":\"$2c\",\"category\":\"Urinary\",\"chapterAr\":\"المسالك البولية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Ketorolac 30mg IM | 45 ج.م: Toradol 30mg IM | 120 ج.م, Ketorolac Arrow 30mg IM | 35 ج.م, Ketorolac GPO 30mg IM | 30 ج.م\\r\\nNalbuphine 20mg IM | 55 ج.م: Nubain 20mg IM | 140 ج.م, Nalbuphine Arrow 20mg IM | 45 ج.م, Nalbuphine GPO 20mg IM | 40 ج.م\\r\\nDrotaverine 40mg tab | 12 ج.م: No-Spa 40mg tab | 40 ج.م, Drotaverine Arrow 40mg tab | 10 ج.م, Drotaverine GPO 40mg tab | 8 ج.م\\r\\nTamsulosin 0.4mg cap | 70 ج.م: Omnic 0.4mg cap | 180 ج.م, Tamsulosin Arrow 0.4mg cap | 65 ج.م, Flomax 0.4mg cap | 200 ج.م\\r\\nSilodosin 8mg cap | 130 ج.م: Rapaflo 8mg cap | 280 ج.م, Silodosin Arrow 8mg cap | 110 ج.م, Silodosin Sandoz 8mg cap | 100 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-051\",\"title\":\"Benign Prostatic Hyperplasia\",\"subtitle\":\"Elderly male — nocturia, weak stream, urgency, retention\",\"content\":\"$2d\",\"category\":\"Urinary\",\"chapterAr\":\"المسالك البولية\",\"alternatives\":\"Omnic 0.4mg cap | 75 ج.م\\nProscar 5mg tab | 120 ج.م\\nUroxal 0.4mg tab | 95 ج.م\\nCernilton tab | 110 ج.م\",\"perDrugAlternatives\":\"Tamsulosin 0.4mg cap | 105 ج.م: Omnic 0.4mg cap | 75 ج.م, Flomax 0.4mg tab | 95 ج.م, Uroxal 0.4mg tab | 65 ج.م\\nFinasteride 5mg tab | 26.4 ج.م: Proscar 5mg tab | 120 ج.م, Finpecia 5mg tab | 55 ج.م, Propecia 1mg tab | 85 ج.م\",\"drugInstructions\":\"⚠️ Tamsulosin: Take AFTER evening meal — reduces dizziness\\r\\n⚠️ First-dose hypotension: May feel dizzy — sit down\\r\\n⚠️ Finasteride: Takes 3-6 months for full effect\\r\\n⚠️ Finasteride: Pregnant women must NOT handle crushed tablets\\r\\n✅ Both can be taken long-term\\r\\n⚠️ Report difficulty urinating, blood in urine, or urinary retention\\r\\n❌ Do NOT use Sildenafil/Tadalafil without telling BPH doctor\\r\",\"drugInteractions\":\"Tamsulosin + PDE5 inhibitors (Sildenafil):\\r\\n⚠️↑ Risk of hypotension. Separate by 4 hours.\\r\\n\\r\\nAlpha-blockers + Other antihypertensives:\\r\\n⚠️ Additive BP lowering. First-dose hypotension risk.\\r\\n\\r\\nFinasteride + Donating blood:\\r\\n⚠️ Finasteride-contaminated blood harmful to pregnant women. Don't donate for 1 month after stopping.\\r\"},{\"id\":\"rochetta-052\",\"title\":\"Overactive Bladder\",\"subtitle\":\"Urgency, frequency, nocturia, urge incontinence\",\"content\":\"$2e\",\"category\":\"Urinary\",\"chapterAr\":\"المسالك البولية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Tolterodine 2mg tab | 65 ج.م: Detrusitol 2mg tab | 160 ج.م, Tolterodine Arrow 2mg tab | 55 ج.م, Tolterodine GPO 2mg tab | 50 ج.م\\r\\nOxybutynin 5mg tab | 30 ج.م: Ditropan 5mg tab | 90 ج.م, Oxybutynin Arrow 5mg tab | 25 ج.م, Oxybutynin GPO 5mg tab | 20 ج.م\\r\\nSolifenacin 5mg tab | 80 ج.م: Vesicare 5mg tab | 220 ج.م, Solifenacin Arrow 5mg tab | 70 ج.م, Solifenacin Sandoz 5mg tab | 60 ج.م\\r\",\"drugInstructions\":\"⚠️ Avoid alcohol — worsens urgency\\r\\n⚠️ Take with or without food\\r\\n⚠️ If dry mouth occurs: sugar-free gum, frequent sips of water\\r\\n⚠️ Urinate on schedule (timed voiding) for best results\\r\",\"drugInteractions\":\"Anticholinergics + Anticholinergics:\\r\\n❌↑↑ Additive effects — dry mouth, constipation, urinary retention, confusion.\\r\\n\\r\\nAnticholinergics + CYP3A4 inhibitors (Ketoconazole, Erythromycin):\\r\\n⚠️↑ Increased anticholinergic side effects.\\r\\n\\r\\nTolterodine + CYP2D6 inhibitors (Fluoxetine, Paroxetine):\\r\\n⚠️↑ Tolterodine levels — reduce dose or switch.\\r\\n\\r\\nAnticholinergics + Opioids:\\r\\n⚠️↑↑ Severe constipation risk.\\r\"},{\"id\":\"rochetta-053\",\"title\":\"Sexually Transmitted Infections\",\"subtitle\":\"Urethritis, discharge, genital lesions — sexual health\",\"content\":\"$2f\",\"category\":\"Urinary\",\"chapterAr\":\"المسالك البولية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Ceftriaxone 250mg IM | 30 ج.م: Rocephin 250mg IM | 80 ج.م, Ceftriaxone Arrow 250mg IM | 25 ج.م, Ceftriaxone GPO 250mg IM | 20 ج.م\\r\\nAzithromycin 1g tab | 90 ج.م: Zithromax 1g tab | 250 ج.م, Azee 1g tab | 120 ج.م, Azithromycin GPO 1g tab | 75 ج.م\\r\\nAcyclovir 400mg tab | 25 ج.م: Zovirax 400mg tab | 80 ج.م, Acyclovir Arrow 400mg tab | 20 ج.م, Acyclovir GPO 400mg tab | 18 ج.م\\r\\nValacyclovir 500mg tab | 80 ج.م: Valtrex 500mg tab | 220 ج.م, Valacyclovir Arrow 500mg tab | 70 ج.م, Valacyclovir Sandoz 500mg tab | 60 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-054\",\"title\":\"Erectile Dysfunction\",\"subtitle\":\"Inability to achieve/maintain erection — assess cardiovascular risk\",\"content\":\"$30\",\"category\":\"Urinary\",\"chapterAr\":\"المسالك البولية\",\"alternatives\":\"Viagra 50mg tab | 120 ج.م\\nCialis 20mg tab | 150 ج.م\\nLevitra 20mg tab | 130 ج.م\\nSildenafil 50mg tab | 45 ج.م\",\"perDrugAlternatives\":\"Sildenafil 50mg tab | 63 ج.م: Viagra 50mg tab | 120 ج.م, Sildenafil Teva 50mg tab | 45 ج.م, Kamagra 50mg tab | 35 ج.م\\nTadalafil 10mg tab | 36 ج.م: Cialis 20mg tab | 150 ج.م, Tadacip 10mg tab | 25 ج.م, Tadalafil Arrow 10mg tab | 20 ج.م\",\"drugInstructions\":\"⚠️⚠️⚠️ NEVER take with ANY form of Nitrates (GTN, Isosorbide) — FATAL\\r\\n⚠️ Tell doctor about ALL medications before starting PDE5 inhibitor\\r\\n⚠️ Sildenafil: Take 30-60 min before, empty stomach for faster effect\\r\\n⚠️ Tadalafil: Can be taken with food. Effect lasts up to 36h\\r\\n⚠️ Start with lowest dose\\r\\n⚠️ Sexual stimulation is required — not automatic\\r\\n⚠️ If erection \u003e4h (priapism) → go to ER immediately\\r\\n⚠️ Alcohol reduces effectiveness\\r\\n❌ Avoid grapefruit juice\\r\\n⚠️ Report sudden vision or hearing loss → stop and seek care\\r\",\"drugInteractions\":\"PDE5 inhibitors (Sildenafil/Tadalafil) + Nitrates (GTN, Isosorbide):\\r\\n❌❌❌ ABSOLUTELY CONTRAINDICATED — Fatal hypotension. NO exceptions.\\r\\n\\r\\nPDE5 inhibitors + Alpha-blockers:\\r\\n⚠️ Additive hypotension. Separate by 4 hours or use lowest doses.\\r\\n\\r\\nPDE5 inhibitors + CYP3A4 inhibitors (Ketoconazole, Erythromycin):\\r\\n⚠️ Increased levels. Reduce dose.\\r\"},{\"id\":\"rochetta-055\",\"title\":\"Edema / Diuretic Therapy\",\"subtitle\":\"Peripheral edema, heart failure, liver disease, nephrotic syndrome\",\"content\":\"$31\",\"category\":\"Urinary\",\"chapterAr\":\"المسالك البولية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Aldactone 25mg tab | 50 ج.م: Spironolactone Arrow 25mg tab | 35 ج.م, Spironolactone GPO 25mg tab | 30 ج.م, Spirotone 25mg tab | 65 ج.م\\r\\nFurosemide 40mg tab | 15 ج.م: Lasix 40mg tab | 50 ج.م, Furosemide Arrow 40mg tab | 12 ج.م, Furosemide GPO 40mg tab | 10 ج.م\\r\\nAldactazide tab | 45 ج.م: Spironolactone+Hydrochlorothiazide | 30 ج.م, Aldactazide GPO | 35 ج.م, Spirotide tab | 55 ج.م\\r\",\"drugInstructions\":\"⚠️ Furosemide: Take in the MORNING — prevents nighttime urination\\r\\n⚠️ Spironolactone: Take at the same time daily\\r\\n⚠️ Monitor daily weight — stable weight = good fluid balance\\r\\n⚠️ Report weight gain \u003e1kg/day or \u003e2kg/week\\r\\n⚠️ Monitor for muscle cramps, weakness (electrolyte imbalance)\\r\\n✅ Furosemide: Best on empty stomach\\r\\n⚠️ Regular blood tests: electrolytes, kidney function\\r\\n❌ Do NOT take potassium supplements unless prescribed\\r\\n❌ Avoid NSAIDs — reduce diuretic effect\\r\\n⚠️ Report irregular heartbeat, muscle weakness\\r\",\"drugInteractions\":\"Spironolactone + ACE Inhibitors:\\r\\n⚠️↑ Hyperkalemia risk. Monitor K+.\\r\\n\\r\\nFurosemide + Digoxin:\\r\\n⚠️ Hypokalemia increases Digoxin toxicity. Monitor K+.\\r\\n\\r\\nSpironolactone + Potassium supplements:\\r\\n❌ Dangerous hyperkalemia. Do NOT combine.\\r\\n\\r\\nLoop diuretics + NSAIDs:\\r\\n⚠️ Reduced diuretic effect + renal damage.\\r\"},{\"id\":\"rochetta-056\",\"title\":\"Common Cold / URTI\",\"subtitle\":\"Viral upper respiratory tract infection — self-limiting 7–10 days\",\"content\":\"$32\",\"category\":\"Respiratory\",\"chapterAr\":\"الجهاز التنفسي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Panadol 500mg tab | 46 ج.م: Paracetamol 500mg tab | 8 ج.م, Efferalgan 500mg tab | 10 ج.م, Doliprane 500mg tab | 12 ج.م\\r\\nAfrin nasal spray (Oxymetazoline 0.05%) | 5 ج.م: Otrivin 0.1% spray | 20 ج.م, Nazol spray | 15 ج.م, Sinuberase spray | 18 ج.م\\r\\nCetirizine 10mg tab | 93 ج.م: Zyrtec 10mg tab | 80 ج.م, Cetirizine Arrow 10mg tab | 20 ج.م, Cetirizine GPO 10mg tab | 15 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-057\",\"title\":\"Acute Bronchitis\",\"subtitle\":\"Cough productive of sputum, often post-viral, ± wheeze\",\"content\":\"$33\",\"category\":\"Respiratory\",\"chapterAr\":\"الجهاز التنفسي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"ACC 200mg sachet | 35 ج.م: Fluimucil 200mg sachet | 60 ج.م, ACC GPO 200mg sachet | 25 ج.م, Acetylcysteine Sandoz 200mg | 20 ج.م\\r\\nNoscapine syrup | 25 ج.م: Noscapine GPO syrup | 18 ج.م, Tusscapsine syrup | 35 ج.م, Noscapine Sandoz syrup | 15 ج.م\\r\\nPanadol 500mg tab | 46 ج.م: Paracetamol 500mg tab | 8 ج.م, Efferalgan 500mg tab | 10 ج.م, Doliprane 500mg tab | 12 ج.م\\r\\nAmoxicillin 500mg cap | 18 ج.م: Amoxil 500mg cap | 45 ج.م, Amoxicillin Arrow 500mg cap | 15 ج.م, Ospamox 500mg cap | 50 ج.م\\r\\nAzithromycin 500mg tab | 55 ج.م: Zithromax 500mg tab | 150 ج.م, Azee 500mg tab | 70 ج.م, Azithromycin GPO 500mg tab | 45 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-058\",\"title\":\"Bronchial Asthma\",\"subtitle\":\"Reversible airway obstruction — wheeze, dyspnea, chest tightness\",\"content\":\"$34\",\"category\":\"Respiratory\",\"chapterAr\":\"الجهاز التنفسي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Ventolin Evohaler (Salbutamol) | 50 ج.م: Salbutamol inhaler | 30 ج.م, Asthmafluor inhaler | 25 ج.م, Salamol Easi-Breathe | 55 ج.م\\r\\nBudesonide Turbuhaler | 250 ج.م: Pulmicort Turbuhaler | 350 ج.م, Budesonide Easyhaler | 200 ج.م, Budesonide Sandoz | 180 ج.م\\r\\nFlixotide Diskus (Fluticasone) | 200 ج.م: Seretide Diskus | 280 ج.م, Fluticasone Easyhaler | 170 ج.م, Flixotide Evohaler | 180 ج.م\\r\\nSingulair 10mg tab (Montelukast) | 180 ج.م: Montelukast Arrow 10mg tab | 100 ج.م, Montelukast GPO 10mg tab | 85 ج.م, Monast 10mg tab | 90 ج.م\\r\",\"drugInstructions\":\"⚠️ ICS (Budesonide/Fluticasone): Daily PREVENTIVE use — NOT rescue\\r\\n⚠️ RINSE mouth after EVERY steroid inhaler — prevents oral thrush\\r\\n⚠️ Salbutamol (Ventolin): RESCUE only — if \u003e2 times/week, see doctor\\r\\n⚠️ Never stop ICS abruptly — risk of severe attack\\r\\n⚠️ Carry rescue inhaler at ALL times\\r\\n⚠️ Check inhaler technique regularly\\r\\n✅ Budesonide: 1-2 puffs morning and evening\\r\\n✅ Salbutamol: 1-2 puffs when needed (max 8/day)\\r\\n❌ Avoid known triggers: dust, smoke, cold air\\r\\n⚠️ Written Asthma Action Plan recommended\\r\",\"drugInteractions\":\"Salbutamol + Beta-blockers (non-selective):\\r\\n❌ May worsen bronchospasm. Use cardioselective beta-blocker only if needed.\\r\\n\\r\\nMontelukast + Phenobarbital:\\r\\n⚠️↓ Reduced Montelukast levels.\\r\"},{\"id\":\"rochetta-059\",\"title\":\"COPD\",\"subtitle\":\"Chronic obstructive pulmonary disease — smoker, progressive dyspnea\",\"content\":\"$35\",\"category\":\"Respiratory\",\"chapterAr\":\"الجهاز التنفسي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Prednisolone 20mg tab | 20 ج.م: Prednisolone Arrow 20mg tab | 15 ج.م, Prednisolone GPO 20mg tab | 12 ج.م, Deltacortril 20mg tab | 45 ج.م\\r\\nVentolin nebulizer (Salbutamol) | 40 ج.م: Salbutamol neb | 25 ج.م, Asthmamist neb | 35 ج.م, Salamol neb | 30 ج.م\\r\\nAtrovent nebulizer (Ipratropium) | 65 ج.م: Ipratropium Arrow neb | 50 ج.م, Ipratropium GPO neb | 40 ج.م, Atrovent HFA inhaler | 80 ج.م\\r\\nSpiriva Handihaler (Tiotropium) | 350 ج.م: Spiriva Respimat | 400 ج.م, Tiotropium Arrow | 280 ج.م, Tiotropium Sandoz | 250 ج.م\\r\\nVentolin Inhaler | 35 ج.م: Salbutamol inhaler | 25 ج.م, Salamol inhaler | 30 ج.م, Asthmafluor inhaler | 20 ج.م\\r\",\"drugInstructions\":\"⚠️ Prednisolone 5-day course: Complete then STOP — do not taper \u003c5 days\\r\\n⚠️ Tiotropium: Load capsule, pierce once, inhale deeply\\r\\n⚠️ RINSE mouth after Budesonide — prevents oral thrush\\r\\n⚠️ Ventolin: Shake well before each puff\\r\\n⚠️ Controlled oxygen: Target SpO2 88-92% — too much O2 dangerous in COPD\\r\\n✅ Take Tiotropium at same time each day\\r\\n⚠️ Get annual flu and pneumococcal vaccines\\r\\n❌ Do NOT smoke — most important intervention\\r\\n⚠️ If rescue inhaler needed \u003e2 times/week, see doctor\\r\",\"drugInteractions\":\"Corticosteroids (Prednisolone) + NSAIDs:\\r\\n⚠️↑↑ GI ulcer/bleeding risk. Add PPI.\\r\\n\\r\\nSalbutamol + Beta-blockers (non-selective):\\r\\n❌ May worsen bronchospasm.\\r\\n\\r\\nTiotropium + Other anticholinergics:\\r\\n⚠️ Additive anticholinergic effects (dry mouth, urinary retention).\\r\"},{\"id\":\"rochetta-060\",\"title\":\"Sinusitis\",\"subtitle\":\"Acute or chronic inflammation of paranasal sinuses\",\"content\":\"$36\",\"category\":\"Respiratory\",\"chapterAr\":\"الجهاز التنفسي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Flixonase nasal spray (Fluticasone) | 120 ج.م: Nasonex nasal spray | 200 ج.م, Fluticasone Nasal Sandoz | 90 ج.م, Avamys spray | 180 ج.م\\r\\nAfrin nasal spray | 5 ج.م: Otrivin 0.1% spray | 20 ج.م, Nazol spray | 15 ج.م, Sinuberase spray | 18 ج.م\\r\\nPanadol 500mg tab | 46 ج.م: Paracetamol 500mg tab | 8 ج.م, Efferalgan 500mg tab | 10 ج.م, Doliprane 500mg tab | 12 ج.م\\r\\nAugmentin 1g tab | 80 ج.م: Amoxicillin+Clavulanate Arrow 1g | 70 ج.م, Amoxicillin+Clavulanate GPO | 60 ج.م, Moxatag 1g tab | 110 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-061\",\"title\":\"Pharyngitis \u0026 Tonsillitis\",\"subtitle\":\"Sore throat — viral vs bacterial (Streptococcus)\",\"content\":\"$37\",\"category\":\"Respiratory\",\"chapterAr\":\"الجهاز التنفسي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Panadol 500mg tab | 46 ج.م: Paracetamol 500mg tab | 8 ج.م, Efferalgan 500mg tab | 10 ج.م, Doliprane 500mg tab | 12 ج.م\\r\\nBrufen 400mg tab | 30 ج.م: Ibuprofen 400mg tab | 15 ج.م, Advil 400mg tab | 35 ج.م, Brufen GPO 400mg tab | 25 ج.م\\r\\nStrepsils lozenge | 15 ج.م: Strepsils Plus lozenge | 25 ج.م, Tyrothricine lozenge | 20 ج.م, Lizobact lozenge | 30 ج.م\\r\\nAmoxicillin 500mg cap | 18 ج.م: Amoxil 500mg cap | 45 ج.م, Amoxicillin Arrow 500mg cap | 15 ج.م, Ospamox 500mg cap | 50 ج.م\\r\\nAzithromycin 500mg tab | 55 ج.م: Zithromax 500mg tab | 150 ج.م, Azee 500mg tab | 70 ج.م, Azithromycin GPO 500mg tab | 45 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-062\",\"title\":\"Allergic Rhinitis\",\"subtitle\":\"Seasonal or perennial — sneezing, itching, watery rhinorrhea\",\"content\":\"[DIAGNOSIS]\\r\\n- Sneezing, nasal itching, clear watery discharge\\r\\n- Nasal congestion (bilateral)\\r\\n- Positive skin prick test or specific IgE\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Special test: Skin prick testing or specific serum IgE (common aeroallergens)\\r\\n- Lab: FBC (eosinophilia), total IgE if systemic allergy suspected\\r\\n- Imaging: Not routinely; consider CT sinuses if coexisting chronic sinusitis\\r\\n- Monitor: Symptom control (sneeze/itch/congestion), adherence to nasal steroid\\r\\n\\r\\n[TREATMENT]\\r\\n- Mild intermittent: Antihistamine PRN\\r\\n- Moderate-severe: Daily antihistamine + Nasal steroid\\r\\n- Persistent: Add leukotriene modifier (Montelukast)\\r\\n\\r\\n[RX]\\r\\n- Cetirizine 10mg tab (Cetirizine HCl) | قرص مرة واحدة يوميًا قبل النوم | 93 ج.م\\r\\n- OR Loratadine 10mg tab (Loratadine) | قرص مرة واحدة يوميًا صباحًا | 17 ج.م\\r\\n- Flixonase nasal spray (Fluticasone 50mcg) | بخاخ 2 نفخة لكل فتحة أنف مرة يوميًا | 133 ج.م\\r\\n- Singulair 10mg tab (Montelukast) | قرص مرة واحدة يوميًا قبل النوم | 156 ج.م\\r\",\"category\":\"Respiratory\",\"chapterAr\":\"الجهاز التنفسي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Cetirizine 10mg tab | 25 ج.م: Zyrtec 10mg tab | 80 ج.م, Cetirizine Arrow 10mg tab | 20 ج.م, Cetirizine GPO 10mg tab | 15 ج.م\\r\\nLoratadine 10mg tab | 30 ج.م: Claritin 10mg tab | 85 ج.م, Loratadine Arrow 10mg tab | 25 ج.م, Loratadine GPO 10mg tab | 20 ج.م\\r\\nFlixonase nasal spray | 120 ج.م: Nasonex nasal spray | 200 ج.م, Fluticasone Sandoz spray | 90 ج.م, Avamys spray | 180 ج.م\\r\\nSingulair 10mg tab | 180 ج.م: Montelukast Arrow 10mg tab | 100 ج.م, Montelukast GPO 10mg tab | 85 ج.م, Monast 10mg tab | 90 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-063\",\"title\":\"Pneumonia\",\"subtitle\":\"Community-acquired — cough, fever, chest pain, consolidation\",\"content\":\"$38\",\"category\":\"Respiratory\",\"chapterAr\":\"الجهاز التنفسي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Augmentin 1g tab | 80 ج.م: Amoxicillin+Clavulanate Arrow 1g | 70 ج.م, Amoxicillin+Clavulanate GPO 1g | 60 ج.م, Moxatag 1g tab | 110 ج.م\\r\\nAzithromycin 500mg tab | 55 ج.م: Zithromax 500mg tab | 150 ج.م, Azee 500mg tab | 70 ج.م, Azithromycin GPO 500mg tab | 45 ج.م\\r\\nFluimucil 600mg effervescent | 70 ج.م: ACC 600mg effervescent | 50 ج.م, Fluimucil GPO 600mg | 55 ج.م, Acetylcysteine Sandoz 600mg | 45 ج.م\\r\\nPanadol 500mg tab | 46 ج.م: Paracetamol 500mg tab | 8 ج.م, Efferalgan 500mg tab | 10 ج.م, Doliprane 500mg tab | 12 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-064\",\"title\":\"Acute Gastroenteritis\",\"subtitle\":\"Adult patient, less than 14 days of watery diarrhea\",\"content\":\"$39\",\"category\":\"GIT\",\"chapterAr\":\"الجهاز الهضمي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"ORS sachet | 5 ج.م: ORS Okaru sachet | 15 ج.م, Electral sachet | 10 ج.م, Hydralyte sachet | 12 ج.م\\r\\nBuscopan 10mg tab | 25 ج.م: Hyoscine Butylbromide Arrow | 15 ج.م, Hyoscine GPO 10mg tab | 12 ج.م, Buscopan Compound | 40 ج.م\\r\\nBrufen 400mg tab | 30 ج.م: Ibuprofen 400mg tab | 15 ج.م, Advil 400mg tab | 35 ج.م, Brufen GPO 400mg tab | 25 ج.م\\r\\nCiprofloxacin 500mg tab | 35 ج.م: Cipro 500mg tab | 90 ج.م, Ciprofloxacin Arrow 500mg tab | 30 ج.م, Ciproxina 500mg tab | 80 ج.م\\r\\nFlagyl 500mg tab | 20 ج.م: Metronidazole 500mg tab | 10 ج.م, Flagyl GPO 500mg tab | 15 ج.م, Metronidazole Arrow 500mg tab | 8 ج.م\\r\",\"drugInstructions\":\"⚠️ ORS: Dissolve sachet in cold water — sip after each loose stool\\r\\n⚠️ Metronidazole: No alcohol during and 48h after\\r\\n⚠️ Ciprofloxacin: Take 2h before or after antacids/dairy\\r\\n⚠️ If bloody diarrhea or high fever → seek urgent care\\r\\n✅ Take Buscopan with food for cramps\\r\\n⚠️ BRAT diet can help recovery\\r\\n❌ Do NOT use Loperamide if fever or blood in stool\\r\",\"drugInteractions\":\"Metronidazole + Alcohol:\\r\\n❌ Disulfiram-like reaction: nausea, vomiting, flushing. Avoid alcohol 48h after.\\r\\n\\r\\nCiprofloxacin + Antacids/Iron/Calcium/Dairy:\\r\\n❌ Severely reduced absorption. Space 2-4 hours.\\r\\n\\r\\nCiprofloxacin + QT-prolonging drugs:\\r\\n⚠️ Increased cardiac risk.\\r\"},{\"id\":\"rochetta-065\",\"title\":\"GERD \u0026 Peptic Ulcer\",\"subtitle\":\"Heartburn, epigastric pain, acid reflux\",\"content\":\"$3a\",\"category\":\"GIT\",\"chapterAr\":\"الجهاز الهضمي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"$3b\",\"drugInstructions\":\"⚠️ PPI: Take 30-60 min BEFORE breakfast for maximum effect\\r\\n⚠️ PPI is a prodrug — needs acidic environment to activate\\r\\n⚠️ Sucralfate: Take 1h BEFORE meals and at bedtime\\r\\n✅ Omeprazole preferred over other PPIs if on Clopidogrel\\r\\n⚠️ Elevate head of bed 15-20cm\\r\\n❌ Avoid: caffeine, chocolate, spicy food, citrus, alcohol, fatty food\\r\",\"drugInteractions\":\"PPI + Clopidogrel:\\r\\n❌ Reduced antiplatelet effect. Use Omeprazole (least interaction among PPIs).\\r\\n\\r\\nH2 Blockers + Antacids:\\r\\n⚠️ Separate by 2 hours — antacids reduce H2 blocker absorption.\\r\\n\\r\\nSucralfate + PPI / H2 Blockers:\\r\\n⚠️ Take Sucralfate 1h apart from acid reducers for full effect.\\r\"},{\"id\":\"rochetta-066\",\"title\":\"Vomiting\",\"subtitle\":\"Nausea and vomiting from a non-surgical cause\",\"content\":\"$3c\",\"category\":\"GIT\",\"chapterAr\":\"الجهاز الهضمي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Motilium 10mg tab (Domperidone) | 30 ج.م: Domperidone Arrow 10mg tab | 20 ج.م, Domperidone GPO 10mg tab | 15 ج.م, Motilium Meltabs | 50 ج.م\\r\\nPrimperan 10mg tab (Metoclopramide) | 15 ج.م: Reglan 10mg tab | 40 ج.م, Metoclopramide Arrow 10mg tab | 12 ج.م, Metoclopramide GPO 10mg tab | 10 ج.م\\r\\nZofran 8mg tab (Ondansetron) | 90 ج.م: Ondansetron Arrow 8mg tab | 60 ج.م, Ondansetron GPO 8mg tab | 50 ج.م, Emeset 8mg tab | 100 ج.م\\r\",\"drugInstructions\":\"⚠️ Metoclopramide: Avoid in patients under 20 — extrapyramidal risk\\r\\n⚠️ Domperidone: Take 15-30 min before meals\\r\\n⚠️ Ondansetron: Dissolve under tongue or take with water\\r\\n✅ Domperidone preferred — does not cross BBB easily\\r\\n⚠️ If vomiting \u003e48h or blood in vomit → seek urgent care\\r\\n⚠️ Sip clear fluids in small amounts\\r\\n❌ Avoid large meals\\r\",\"drugInteractions\":\"Metoclopramide + SSRIs (Fluoxetine):\\r\\n⚠️↑ Risk of extrapyramidal symptoms.\\r\\n\\r\\nOndansetron + QT-prolonging drugs:\\r\\n⚠️ Further QT prolongation. ECG monitoring.\\r\\n\\r\\nDomperidone + CYP3A4 inhibitors (Ketoconazole, Erythromycin):\\r\\n⚠️↑↑ Domperidone levels → cardiac risk. Avoid.\\r\"},{\"id\":\"rochetta-067\",\"title\":\"Constipation\",\"subtitle\":\"Infrequent or difficult bowel movements, no organic cause\",\"content\":\"[DIAGNOSIS]\\r\\n- Stimulant: Senna, Bisacodyl\\r\\n- Osmotic: Lactulose, Mg salts, PEG\\r\\n- Bulk-forming: Bran, Ispaghula\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Lab: Calcium, TSH, FBS (exclude hypothyroidism, diabetes), renal function, electrolytes\\r\\n- Special test: Red flags screen (blood in stool, weight loss, new change after 50) → colonoscopy\\r\\n- Monitor: Stool frequency, response to laxative, electrolyte balance (chronic stimulant use)\\r\\n- Screen: Medication review for constipating drugs (opioids, iron, calcium blockers)\\r\\n\\r\\n[TREATMENT]\\r\\n- Red flags — refer: Blood in stool, unexplained weight loss\\r\\n- New change in bowel habit after age 50\\r\\n\\r\\n[WARNING]\\r\\nChronic stimulant laxative use risks electrolyte disturbance and bowel dependency — limit to short courses.\\r\\n\\r\\n[RX]\\r\\n- Duphalac syrup (Lactulose) | ملعقتين كبيرتين، مرتين يوميًا | 60 ج.م\\r\\n- Picolax drops (Sodium Picosulphate) | 10-15 نقطة قبل النوم | 24 ج.م\\r\\n- OR Abilaxine 5mg tab (Bisacodyl) | قرص قبل النوم | 4.5 ج.م\\r\",\"category\":\"GIT\",\"chapterAr\":\"الجهاز الهضمي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Duphalac syrup (Lactulose) | 55 ج.م: Lactulose Arrow syrup | 35 ج.م, Lactulose GPO syrup | 30 ج.م, Lactulose Sandoz syrup | 28 ج.م\\r\\nPicolax drops | 45 ج.م: Sodium Picosulfate Arrow drops | 30 ج.م, Picolax GPO drops | 35 ج.م, Dulcolax drops | 50 ج.م\\r\\nAbilaxine 5mg tab (Bisacodyl) | 20 ج.م: Dulcolax 5mg tab | 35 ج.م, Bisacodyl Arrow 5mg tab | 15 ج.م, Bisacodyl GPO 5mg tab | 12 ج.م\\r\",\"drugInstructions\":\"⚠️ Drink plenty of water (2+ litres/day) with any laxative\\r\\n⚠️ Duphalac: May take 2-3 days for full effect\\r\\n⚠️ Stimulants (Picolax/Bisacodyl): Work within 6-12 hours — take at bedtime\\r\\n⚠️ Increase dietary fibre gradually to avoid bloating\\r\",\"drugInteractions\":\"Lactulose + Antacids:\\r\\n⚠️ Antacids reduce lactulose effectiveness — separate by 2 hours.\\r\\n\\r\\nStimulant Laxatives + Diuretics:\\r\\n⚠️↑ Risk of electrolyte imbalance — monitor potassium and magnesium.\\r\\n\\r\\nBisacodyl + Milk / Antacids:\\r\\n❌ Reduce bisacodyl absorption — take on empty stomach or 1h apart.\\r\\n\\r\\nChronic Stimulant Use:\\r\\n⚠️ Bowel dependency — limit to short courses, prefer osmotic laxatives long-term.\\r\"},{\"id\":\"rochetta-068\",\"title\":\"Spastic Colon / IBS\",\"subtitle\":\"Recurrent abdominal pain with altered bowel habit\",\"content\":\"[DIAGNOSIS]\\r\\n- Colicky pain: Mebeverine, Trimebutine\\r\\n- Diarrhea-dominant: Streptoquin, Loperamide with caution\\r\\n- Constipation-dominant: Lactulose, bulk-forming agents\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Lab: CBC, TSH, FBS, coeliac serology (tTG-IgA), ESR/CRP — exclude organic causes\\r\\n- Culture: Stool MC\u0026S if infectious diarrhea suspected\\r\\n- Special test: IBS diagnostic criteria (Rome IV); colonoscopy if alarm features or age \u003e 50\\r\\n- Monitor: Stool diary (Bristol scale), symptom frequency, response to antispasmodic\\r\\n\\r\\n[TREATMENT]\\r\\n- Small frequent meals, avoid large ones\\r\\n- Reduce caffeine and stimulants\\r\\n- Regular physical activity, good sleep\\r\\n\\r\\n[WARNING]\\r\\nRifaximin is not a general IBS treatment — proven role only in IBS-D with suspected bacterial overgrowth.\\r\\n\\r\\n[RX]\\r\\n- Duspatalin 135mg tab (Mebeverine HCl) | قرص 3 مرات يوميًا قبل الأكل بـ20 دقيقة | 56 ج.م\\r\\n- OR Coloverin A tab (Mebeverine + Sulpiride) | قرص 3 مرات يوميًا | 99 ج.م\\r\\n- Streptoquin tab (Multi-component) | قرص 3 مرات يوميًا | 46 ج.م\\r\",\"category\":\"GIT\",\"chapterAr\":\"الجهاز الهضمي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Duspatalin 135mg tab (Mebeverine) | 60 ج.م: Mebeverine Arrow 135mg tab | 40 ج.م, Mebeverine GPO 135mg tab | 35 ج.م, Colofac 135mg tab | 75 ج.م\\r\\nColoverin A tab | 25 ج.م: Hyoscine Butylbromide Arrow 10mg | 15 ج.م, Buscopan 10mg tab | 30 ج.م, Hyoscine GPO 10mg tab | 12 ج.م\\r\\nStreptoquin tab | 200 ج.م: Streptoquin GPO tab | 170 ج.م, Rifaximin 550mg tab | 180 ج.م, Normix 550mg tab | 250 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-069\",\"title\":\"Oral Problems\",\"subtitle\":\"Gingivitis, herpes, thrush, oral sores\",\"content\":\"[DIAGNOSIS]\\r\\n- Vesicles around lip: Herpes simplex\\r\\n- White patches: Mouth thrush\\r\\n- Painful ulcer, white membrane: Oral sore\\r\\n- Red swollen gums: Gingivitis\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Culture: Swab of lesions/vesicles for HSV if herpes suspected; oral swab for candida\\r\\n- Special test: Full dental examination; biopsy if ulcer persists \u003e 2 weeks\\r\\n- Monitor: Lesion healing, response to treatment, recurrence (herpes)\\r\\n- Screen: Blood count if recurrent aphthous ulcers (iron, B12, folate deficiency)\\r\\n\\r\\n[WARNING]\\r\\nUlcer lasting over 2 weeks, recurrent, or with systemic symptoms — think autoimmune cause or refer.\\r\\n\\r\\n[RX]\\r\\n- Chlorhexidine mouth wash (Chlorhexidine Gluconate) | غرغرة 3 مرات يوميًا | 55 ج.م\\r\\n- Amoxicillin 500mg cap (Amoxicillin Trihydrate) | كبسولة 3 مرات يوميًا لمدة 5-7 أيام | 8 ج.م\\r\\n- Nystatin oral suspension (Nystatin) | مضمضة وبلع 4 مرات يوميًا لمدة أسبوع | 30 ج.م\\r\\n- Acyclovir cream (Acyclovir 5%) | يوضع فور ظهور أول أعراض الهربس | 27 ج.م\\r\",\"category\":\"GIT\",\"chapterAr\":\"الجهاز الهضمي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Chlorhexidine mouth wash | 35 ج.م: Hibitane mouth wash | 60 ج.م, Chlorhexidine GPO | 25 ج.م, Corsodyl mouth wash | 70 ج.م\\r\\nAmoxicillin 500mg cap | 18 ج.م: Amoxil 500mg cap | 45 ج.م, Amoxicillin Arrow 500mg cap | 15 ج.م, Ospamox 500mg cap | 50 ج.م\\r\\nNystatin oral suspension | 40 ج.م: Mycostatin oral suspension | 80 ج.م, Nystatin GPO suspension | 30 ج.م, Nystatin Sandoz suspension | 25 ج.م\\r\\nAcyclovir cream | 20 ج.م: Zovirax cream | 55 ج.م, Acyclovir GPO cream | 15 ج.م, Acivir cream | 18 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-070\",\"title\":\"Inflammatory Bowel Disease\",\"subtitle\":\"Confirmed UC / Crohn's — supportive role of general practice\",\"content\":\"[DIAGNOSIS]\\r\\n- Mesalazine (5-ASA) — first line for mild-moderate UC\\r\\n- Sulfasalazine — cheaper alternative, more side effects\\r\\n- Needs endoscopic / pathology confirmation before treatment\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Biopsy: Endoscopy with colonoscopy and pathology — confirm UC or Crohn's diagnosis\\r\\n- Lab: FBC (anaemia), ESR/CRP, faecal calprotectin, renal function, LFTs, electrolytes\\r\\n- Culture: Stool MC\u0026S to exclude infective colitis before starting therapy\\r\\n- Monitor: Stool frequency, weight, abdominal symptoms, response to mesalazine\\r\\n\\r\\n[TREATMENT]\\r\\n- Recognize the pattern and refer to GI specialist\\r\\n- Supportive: nutrition, symptom monitoring\\r\\n- Not the setting to start immunosuppressive therapy\\r\\n\\r\\n[WARNING]\\r\\nSulfasalazine reduces folic acid absorption — supplement separately.\\r\\n\\r\\n[RX]\\r\\n- Mesalazine 500mg tab (Mesalazine / 5-ASA) | حسب تعليمات استشاري الجهاز الهضمي | 120 ج.م\\r\",\"category\":\"GIT\",\"chapterAr\":\"الجهاز الهضمي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Mesalazine 500mg tab | 120 ج.م: Asacol 500mg tab | 250 ج.م, Mesalazine Arrow 500mg tab | 100 ج.م, Mesalazine GPO 500mg tab | 90 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-071\",\"title\":\"Iron Solutions\",\"subtitle\":\"Oral / parenteral iron — anaemia of various causes\",\"content\":\"$3d\",\"category\":\"Others\",\"chapterAr\":\"أخرى\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Ferrograd C tab (Ferrous Sulphate + Ascorbic Acid) | 45 ج.م: Ferrograd Forte tab | 60 ج.م, Fumafer Plus tab | 30 ج.م, Ferrous Sulphate Arrow tab | 20 ج.م\\r\\nFerrous Sulphate 325mg tab | 15 ج.م: Ferrous Sulphate GPO tab | 10 ج.م, Ferrous Fumarate 325mg tab | 18 ج.م, Iron Plus tab | 22 ج.م\\r\\nIron sucrose vial | 85 ج.م: Ferrlecit vial | 120 ج.م, Monofer vial | 200 ج.م, Venofer vial | 150 ج.م\\r\\nVitamin C 500mg tab | 12 ج.م: Celin 500mg tab | 20 ج.م, Vitamin C Arrow tab | 10 ج.م, Redoxon C tab | 35 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"❌ Iron + Antacids: Iron absorption significantly reduced — take iron 2 hours apart\\r\\n❌ Iron + Tetracycline / Doxycycline: Iron chelates tetracyclines — separate by 3 hours\\r\\n❌ Iron + Fluoroquinolones (Ciprofloxacin, Levofloxacin): Chelation reduces antibiotic absorption\\r\\n❌ Iron + Levothyroxine: Iron impairs thyroid hormone absorption — take 4 hours apart\\r\\n⚠️ Iron + PPIs: Reduced gastric acid decreases iron absorption — may need IV iron\\r\\n⚠️ Iron + Milk / Tea / Coffee: Tannins and calcium reduce absorption — avoid with iron dose\\r\\n✅ Iron + Vitamin C: Enhances absorption — recommended combination\\r\"},{\"id\":\"rochetta-072\",\"title\":\"Liver Support\",\"subtitle\":\"Adjunct supplements — not a substitute for treating the cause\",\"content\":\"[DIAGNOSIS]\\r\\n- Silymarin: Regeneration + antioxidant\\r\\n- Glutathione: Toxin protection\\r\\n- Lecithin: Removes fat deposits\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Lab: LFTs (ALT/AST), bilirubin, GGT, viral hepatitis screen (HBsAg, anti-HCV)\\r\\n- Imaging: Abdominal ultrasound — steatosis, cirrhosis, portal hypertension\\r\\n- Special test: Fibroscan (liver stiffness) if fibrosis suspected; lipid profile\\r\\n- Monitor: LFTs, symptom response, alcohol intake, weight (NAFLD)\\r\\n\\r\\n[TREATMENT]\\r\\n- These are supportive only\\r\\n- The underlying cause — virus, fatty liver, toxin — must be diagnosed and treated\\r\\n\\r\\n[RX]\\r\\n- Legalon cap (Silymarin) | كبسولة مرتين يوميًا | 50 ج.م\\r\\n- OR Hepafort cap (Silymarin + Glutathione + Lecithin) | كبسولة مرتين يوميًا | 33 ج.م\\r\",\"category\":\"GIT\",\"chapterAr\":\"الجهاز الهضمي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Legalon cap (Silymarin) | 80 ج.م: Silymarin Arrow cap | 55 ج.م, Silymarin GPO cap | 45 ج.م, Heparex cap | 60 ج.م\\r\\nHepafort cap | 50 ج.م: Liv-52 cap | 65 ج.م, Hepafort GPO cap | 40 ج.م, Livomyn cap | 55 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"}],\"drugCounts\":{\"rochetta-001\":4,\"rochetta-002\":3,\"rochetta-003\":3,\"rochetta-004\":3,\"rochetta-005\":3,\"rochetta-006\":2,\"rochetta-007\":3,\"rochetta-008\":3,\"rochetta-009\":3,\"rochetta-010\":3,\"rochetta-011\":2,\"rochetta-012\":3,\"rochetta-013\":3,\"rochetta-014\":5,\"rochetta-015\":3,\"rochetta-016\":3,\"rochetta-017\":2,\"rochetta-018\":4,\"rochetta-019\":3,\"rochetta-020\":3,\"rochetta-021\":3,\"rochetta-022\":11,\"rochetta-023\":3,\"rochetta-024\":2,\"rochetta-025\":5,\"rochetta-026\":3,\"rochetta-027\":3,\"rochetta-028\":3,\"rochetta-029\":3,\"rochetta-030\":2,\"rochetta-031\":4,\"rochetta-032\":2,\"rochetta-033\":3,\"rochetta-034\":3,\"rochetta-035\":4,\"rochetta-036\":3,\"rochetta-037\":3,\"rochetta-038\":1,\"rochetta-039\":2,\"rochetta-040\":3,\"rochetta-041\":4,\"rochetta-042\":4,\"rochetta-043\":5,\"rochetta-044\":3,\"rochetta-045\":3,\"rochetta-046\":2,\"rochetta-047\":2,\"rochetta-048\":9,\"rochetta-049\":4,\"rochetta-050\":5,\"rochetta-051\":3,\"rochetta-052\":3,\"rochetta-053\":4,\"rochetta-054\":3,\"rochetta-055\":4,\"rochetta-056\":3,\"rochetta-057\":5,\"rochetta-058\":4,\"rochetta-059\":5,\"rochetta-060\":4,\"rochetta-061\":5,\"rochetta-062\":4,\"rochetta-063\":4,\"rochetta-064\":5,\"rochetta-065\":3,\"rochetta-066\":3,\"rochetta-067\":3,\"rochetta-068\":3,\"rochetta-069\":4,\"rochetta-070\":1,\"rochetta-071\":4,\"rochetta-072\":2},\"forceDoctor\":true}]}],[\"$L3e\",\"$L3f\"],\"$L40\"]}]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$L41\",null,{\"children\":\"$L42\"}],[\"$\",\"div\",null,{\"hidden\":true,\"childre
