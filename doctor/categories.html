rbic Acid) | قرص واحد يوميًا على معدة فارغة مع كوب ماء | 45 ج.م\r\n- OR Ferrous Sulphate 325mg tab (Ferrous Sulphate) | قرص مرتين إلى 3 مرات يوميًا بعد الأكل | 15 ج.م\r\n- OR Iron sucrose vial (Iron Sucrose) | حقن وريدي حسب تعليمات الطبيب | 85 ج.م\r\n- Vitamin C 500mg tab (Ascorbic Acid) | قرص مرة يوميًا مع الحديد | 12 ج.م\r9:[\"$\",\"$1\",\"c\",{\"children\":[[\"$\",\"$Le\",null,{\"role\":\"doctor\",\"children\":[\"$\",\"$Lf\",null,{\"chapters\":[{\"slug\":\"psychiatry\",\"name\":\"Psychiatry\",\"arabicName\":\"أعصاب / الطب النفسي\",\"colorHex\":\"#6E5DB3\",\"icon\":\"brain\",\"tagline\":\"Mental health\",\"count\":8},{\"slug\":\"pain-analgesics\",\"name\":\"Pain \u0026 Analgesics\",\"arabicName\":\"الألم والمسكنات\",\"colorHex\":\"#C1652B\",\"icon\":\"pill\",\"tagline\":\"Pain management\",\"count\":8},{\"slug\":\"antibiotics\",\"name\":\"Antibiotics\",\"arabicName\":\"المضادات الحيوية\",\"colorHex\":\"#7A8C3F\",\"icon\":\"syringe\",\"tagline\":\"Infections\",\"count\":7},{\"slug\":\"dermatology\",\"name\":\"Dermatology\",\"arabicName\":\"الأمراض الجلدية\",\"colorHex\":\"#B4736A\",\"icon\":\"jar\",\"tagline\":\"Skin \u0026 hair\",\"count\":15},{\"slug\":\"cardiovascular\",\"name\":\"Cardiovascular\",\"arabicName\":\"القلب والأوعية الدموية\",\"colorHex\":\"#B23B3B\",\"icon\":\"heart\",\"tagline\":\"Heart \u0026 vessels\",\"count\":8},{\"slug\":\"urinary\",\"name\":\"Urinary\",\"arabicName\":\"المسالك البولية\",\"colorHex\":\"#6B5B73\",\"icon\":\"droplet\",\"tagline\":\"Kidney \u0026 bladder\",\"count\":8},{\"slug\":\"respiratory\",\"name\":\"Respiratory\",\"arabicName\":\"الجهاز التنفسي\",\"colorHex\":\"#3E7EA6\",\"icon\":\"lungs\",\"tagline\":\"Lungs \u0026 airway\",\"count\":8},{\"slug\":\"git\",\"name\":\"GIT\",\"arabicName\":\"الجهاز الهضمي\",\"colorHex\":\"#4A8B7C\",\"icon\":\"bowl\",\"tagline\":\"Digestive system\",\"count\":9},{\"slug\":\"others\",\"name\":\"Others\",\"arabicName\":\"أخرى\",\"colorHex\":\"#6B6B6B\",\"icon\":\"grid\",\"tagline\":\"Other cases\",\"count\":1}],\"prescriptions\":[{\"id\":\"rochetta-001\",\"title\":\"Major Depressive Disorder\",\"subtitle\":\"Persistent low mood, anhedonia, sleep/appetite changes — most common psychiatric disorder\",\"content\":\"$10\",\"category\":\"Psychiatry\",\"chapterAr\":\"أعصاب / الطب النفسي\",\"alternatives\":\"Cipralex 10mg tab | 155 ج.م\\nZoloft 50mg tab | 34.8 ج.م\\nAnafranil 25mg cap | 28 ج.م\\nRemeron 15mg tab | 135 ج.م\",\"perDrugAlternatives\":\"Sertraline 50mg tab | 34.8 ج.م: Zoloft 50mg tab | 34.8 ج.م, Lustral 50mg tab | 38 ج.م, Deprax 50mg tab | 30 ج.م\\nEscitalopram 10mg tab | 120 ج.م: Cipralex 10mg tab | 155 ج.م, Esoprex 10mg tab | 85 ج.م, Lonopin 10mg tab | 70 ج.م\\nDuloxetine 30mg cap | 243 ج.م: Cymbalta 30mg cap | 280 ج.م, Dulester 30mg cap | 165 ج.م, Yentreve 30mg cap | 195 ج.م\\nMirtazapine 15mg tab | 135 ج.م: Remeron 15mg tab | 155 ج.م, Mirtaron 15mg tab | 95 ج.م, Mirzaten 15mg tab | 110 ج.م\",\"drugInstructions\":\"⚠️ Take at the same time daily — consistency matters\\r\\n⚠️ Do NOT stop suddenly — taper over 2-4 weeks to avoid withdrawal\\r\\n⚠️ Full therapeutic effect takes 4-8 weeks — don't judge too early\\r\\n⚠️ Metallic taste is common in first 2 weeks — usually subsides\\r\\n✅ Sertraline: Take with or without food\\r\\n✅ Escitalopram: Take with or without food\\r\\n❌ Avoid alcohol — increases sedation and liver burden\\r\\n❌ Avoid MAOIs (old antidepressants) — fatal interaction\\r\\n⚠️ If you feel worse or have suicidal thoughts in first 4 weeks, contact your doctor immediately\\r\",\"drugInteractions\":\"SSRIs (Sertraline/Escitalopram) + MAOIs:\\r\\n❌ Serotonin Syndrome — potentially fatal. NEVER combine. Washout period 2-4 weeks.\\r\\n\\r\\nSSRIs + Tramadol / Triptans:\\r\\n⚠️ Increased risk of Serotonin Syndrome. Avoid or use with extreme caution.\\r\\n\\r\\nSSRIs + NSAIDs / Aspirin / Anticoagulants:\\r\\n⚠️ Increased GI bleeding risk. Add PPI if combining.\\r\\n\\r\\nDuloxetine + CYP1A2 inhibitors (Ciprofloxacin, Fluvoxamine):\\r\\n⚠️ Increased Duloxetine levels. Monitor for side effects.\\r\"},{\"id\":\"rochetta-002\",\"title\":\"Generalized Anxiety Disorder\",\"subtitle\":\"Excessive worry ≥ 6 months — muscle tension, restlessness, fatigue\",\"content\":\"$11\",\"category\":\"Psychiatry\",\"chapterAr\":\"أعصاب / الطب النفسي\",\"alternatives\":\"Cipralex 10mg tab | 155 ج.م\\nXanax 0.5mg tab | 14 ج.م\\nValium 5mg tab | 11 ج.م\\nBuspar 10mg tab | 95 ج.م\",\"perDrugAlternatives\":\"Escitalopram 10mg tab | 120 ج.م: Cipralex 10mg tab | 155 ج.م, Esoprex 10mg tab | 85 ج.م, Lonopin 10mg tab | 70 ج.م\\nDiazepam 5mg tab | 11 ج.م: Valium 5mg tab | 11 ج.م, Diazepex 5mg tab | 8 ج.م, Anxicalm 5mg tab | 9 ج.م\\nAlprazolam 0.5mg tab | 7.5 ج.م: Xanax 0.5mg tab | 14 ج.م, Alprax 0.5mg tab | 6 ج.م, Bzano 0.5mg tab | 5 ج.م\",\"drugInstructions\":\"⚠️ Benzodiazepines: Use ONLY for 2-4 weeks maximum\\r\\n⚠️ Risk of dependence increases with prolonged use\\r\\n✅ Take Escitalopram at the same time daily\\r\\n✅ Diazepam: Can take with or without food\\r\\n✅ Alprazolam: Can take with or without food\\r\\n❌ Do NOT drive or operate machinery while on Benzodiazepines\\r\\n❌ Avoid alcohol completely\\r\\n⚠️ Taper Benzodiazepines gradually — never stop suddenly\\r\",\"drugInteractions\":\"Benzodiazepines (Diazepam/Alprazolam) + Opioids:\\r\\n❌ Life-threatening respiratory depression. NEVER combine.\\r\\n\\r\\nBenzodiazepines + Alcohol:\\r\\n❌ Severe CNS depression, respiratory failure, death.\\r\\n\\r\\nBenzodiazepines + Other CNS depressants (Antihistamines, Gabapentin):\\r\\n⚠️ Increased sedation. Use lowest doses.\\r\\n\\r\\nEscitalopram: See MDD interactions for SSRI interactions.\\r\"},{\"id\":\"rochetta-003\",\"title\":\"Bipolar Affective Disorder\",\"subtitle\":\"Alternating manic and depressive episodes — lithium remains gold standard\",\"content\":\"$12\",\"category\":\"Psychiatry\",\"chapterAr\":\"أعصاب / الطب النفسي\",\"alternatives\":\"Lithium 300mg tab | 25 ج.م\\nDepakine 500mg tab | 42 ج.م\\nSeroquel 200mg tab | 120 ج.م\\nLamictal 25mg tab | 165 ج.م\",\"perDrugAlternatives\":\"Lithium 300mg tab | 25 ج.م: Lithobid 300mg tab | 30 ج.م, Cadelit 300mg tab | 22 ج.م, Lithane 300mg tab | 28 ج.م\\nValproic acid 500mg tab | 42 ج.م: Depakine 500mg tab | 42 ج.م, Depakene 500mg cap | 55 ج.م, Valparin 500mg tab | 38 ج.م\\nQuetiapine 200mg tab | 120 ج.م: Seroquel 200mg tab | 120 ج.م, Quetial 200mg tab | 85 ج.م, Ketiap 200mg tab | 95 ج.م\\nLamotrigine 25mg tab | 165 ج.م: Lamictal 25mg tab | 165 ج.م, Lamogine 25mg tab | 110 ج.م, Lamictal 50mg tab | 185 ج.م\",\"drugInstructions\":\"⚠️ Lithium: Narrow therapeutic window — regular blood monitoring essential\\r\\n⚠️ Therapeutic range: 0.6-0.8 mmol/L. Toxicity \u003e 1.5 mmol/L\\r\\n⚠️ Maintain consistent salt and fluid intake — dehydration increases lithium levels\\r\\n⚠️ Signs of toxicity: tremor, vomiting, confusion → seek emergency care\\r\\n⚠️ Check renal function and thyroid regularly\\r\\n✅ Take Lithium with food to reduce GI upset\\r\\n✅ Quetiapine: Take at bedtime (sedating)\\r\\n❌ Avoid NSAIDs — use Paracetamol for pain\\r\\n❌ Avoid dehydration — drink adequate fluids daily\\r\",\"drugInteractions\":\"Lithium + NSAIDs (Ibuprofen, Diclofenac):\\r\\n❌ Increased lithium levels → toxicity. Use Paracetamol instead.\\r\\n\\r\\nLithium + ACE Inhibitors (Ramipril):\\r\\n❌ Increased lithium levels → toxicity. Monitor closely.\\r\\n\\r\\nLithium + Thiazide diuretics:\\r\\n❌ Increased lithium levels → toxicity. Avoid.\\r\\n\\r\\nCarbamazepine + OCPs, Warfarin, most drugs:\\r\\n⚠️ Strong CYP450 inducer — dramatically reduces effectiveness of many drugs including OCPs.\\r\\n\\r\\nValproic acid + Lamotrigine:\\r\\n⚠️ Risk of severe skin rash (SJS). Titrate Lamotrigine very slowly.\\r\"},{\"id\":\"rochetta-004\",\"title\":\"Schizophrenia\",\"subtitle\":\"Hallucinations, delusions, disorganized thinking — chronic psychotic illness\",\"content\":\"$13\",\"category\":\"Psychiatry\",\"chapterAr\":\"أعصاب / الطب النفسي\",\"alternatives\":\"Risperdal 2mg tab | 18 ج.م\\nZyprexa 10mg tab | 145 ج.م\\nSeroquel 200mg tab | 120 ج.م\\nAbilify 10mg tab | 280 ج.م\",\"perDrugAlternatives\":\"Risperidone 2mg tab | 18 ج.م: Risperdal 2mg tab | 18 ج.م, Rispen 2mg tab | 12 ج.م, Speridan 2mg tab | 10 ج.م\\nOlanzapine 10mg tab | 145 ج.م: Zyprexa 10mg tab | 145 ج.م, Olanza 10mg tab | 95 ج.م, Olapin 10mg tab | 85 ج.م\\nQuetiapine 200mg tab | 120 ج.م: Seroquel 200mg tab | 120 ج.م, Quetial 200mg tab | 85 ج.م, Ketiap 200mg tab | 95 ج.م\\nAripiprazole 10mg tab | 280 ج.م: Abilify 10mg tab | 280 ج.م, Arpipraz 10mg tab | 180 ج.م, Aripez 10mg tab | 150 ج.م\",\"drugInstructions\":\"⚠️ Do NOT stop antipsychotics suddenly — risk of relapse\\r\\n⚠️ Metabolic monitoring: weight, blood sugar, lipids every 3-6 months\\r\\n⚠️ Olanzapine carries highest metabolic risk\\r\\n✅ Take Risperidone at the same time daily\\r\\n✅ Take Olanzapine/Quetiapine at bedtime (sedating)\\r\\n⚠️ Report any unusual movements (tardive dyskinesia) immediately\\r\\n⚠️ Report fever + muscle rigidity immediately (NMS — emergency)\\r\\n❌ Avoid alcohol — worsens symptoms\\r\\n❌ Avoid overheating and dehydration (especially Clozapine)\\r\",\"drugInteractions\":\"Antipsychotics + QT-prolonging drugs (Amiodarone, Fluoroquinolones, Macrolides):\\r\\n⚠️ Increased risk of Torsades de Pointes. ECG monitoring recommended.\\r\\n\\r\\nClozapine + Benzodiazepines:\\r\\n⚠️ Risk of severe hypotension and respiratory depression. Avoid.\\r\\n\\r\\nRisperidone + CYP2D6 inhibitors (Fluoxetine, Paroxetine):\\r\\n⚠️ Increased Risperidone levels. Dose adjustment may be needed.\\r\"},{\"id\":\"rochetta-005\",\"title\":\"Insomnia\",\"subtitle\":\"Difficulty initiating or maintaining sleep — poor sleep hygiene most common cause\",\"content\":\"$14\",\"category\":\"Psychiatry\",\"chapterAr\":\"أعصاب / الطب النفسي\",\"alternatives\":\"Stilnox 10mg tab | 28 ج.م\\nMelatonin 3mg tab | 35 ج.م\\nAmitriptyline 25mg tab | 12 ج.م\\nDoxepin 25mg cap | 45 ج.م\",\"perDrugAlternatives\":\"Zolpidem 5mg tab | 22 ج.م: Stilnox 10mg tab | 28 ج.م, Zolpidem Sanofi 5mg tab | 18 ج.م, Ambien 10mg tab | 35 ج.م\\nMelatonin 2mg tab | 30 ج.م: Melatone 3mg tab | 35 ج.م, Circadin 2mg tab | 45 ج.م, Natrol Melatonin 5mg tab | 28 ج.م\\nAmitriptyline 10mg tab | 25.5 ج.م: Tryptizol 25mg tab | 12 ج.م, Laroxyl 10mg tab | 15 ج.م, Endep 10mg tab | 10 ج.م\",\"drugInstructions\":\"⚠️ Zolpidem: Use ONLY for 2-4 weeks maximum\\r\\n⚠️ Take immediately before getting into bed — do not take earlier\\r\\n✅ Melatonin: Take 30-60 minutes before desired bedtime\\r\\n✅ Amitriptyline: Take at bedtime (sedating)\\r\\n❌ Do NOT take Zolpidem if you cannot commit to 7-8 hours of sleep\\r\\n❌ Avoid alcohol completely — dangerous synergy\\r\\n⚠️ Practice sleep hygiene: regular schedule, no screens 1h before bed\\r\",\"drugInteractions\":\"Zolpidem + Opioids:\\r\\n❌ Increased risk of respiratory depression and death.\\r\\n\\r\\nZolpidem + Other CNS depressants (Benzodiazepines, Antihistamines, Alcohol):\\r\\n⚠️ Additive sedation. Use lowest effective dose.\\r\\n\\r\\nAmitriptyline + MAOIs:\\r\\n❌ Serotonin Syndrome. NEVER combine.\\r\"},{\"id\":\"rochetta-006\",\"title\":\"ADHD\",\"subtitle\":\"Inattention, hyperactivity, impulsivity — children and adults\",\"content\":\"[DIAGNOSIS]\\r\\n- Inattention: difficulty sustaining tasks, forgetfulness\\r\\n- Hyperactivity: fidgeting, restlessness\\r\\n- Impulsivity: interrupting, difficulty waiting turn\\r\\n- Onset before age 12, present in ≥ 2 settings\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Lab: CBC, FBS, TSH, LFTs — rule out thyroid/metabolic mimic\\r\\n- Special test: Conners' rating scale (children), ASRS (adults); echocardiogram if cardiac history\\r\\n- Monitor: Height, weight, appetite, heart rate, BP before titrating stimulant doses\\r\\n- ECG: Baseline if family history of cardiac disease or palpitations\\r\\n\\r\\n[TREATMENT]\\r\\n- Children: Methylphenidate 1st line\\r\\n- Adults: Lisdexamfetamine or Methylphenidate\\r\\n- Non-stimulant: Atomoxetine (SNRI)\\r\\n- Psychoeducation: Essential for all patients + behavioral therapy\\r\\n\\r\\n[RX]\\r\\n- Methylphenidate 18mg SR tab (Methylphenidate HCl) | قرص مرة واحدة صباحًا — تزاد كل أسبوع | —\\r\\n- OR Atomoxetine 25mg cap (Atomoxetine HCl) | كبسولة مرة واحدة يوميًا — non-stimulant | —\\r\",\"category\":\"Psychiatry\",\"chapterAr\":\"أعصاب / الطب النفسي\",\"alternatives\":\"Ritalin 10mg tab | 45 ج.م\\nConcerta 36mg tab | 220 ج.م\\nStrattera 40mg cap | 350 ج.م\\nAdderall 10mg tab | 180 ج.م\",\"perDrugAlternatives\":\"Methylphenidate 10mg tab | 45 ج.م: Ritalin 10mg tab | 45 ج.م, Methylin 10mg tab | 30 ج.م, MPH 10mg tab | 25 ج.م\\nMethylphenidate ER 36mg tab | 220 ج.م: Concerta 36mg tab | 220 ج.م, Metadate CD 36mg tab | 180 ج.م, Equasym XL 36mg tab | 150 ج.م\\nAtomoxetine 40mg cap | 350 ج.م: Strattera 40mg cap | 350 ج.م, Atomox 40mg cap | 220 ج.م, Attent 40mg cap | 190 ج.م\",\"drugInstructions\":\"⚠️ Take SR in the morning — do not take after noon (insomnia risk)\\r\\n⚠️ Do NOT crush or chew SR/ER tablets — swallow whole\\r\\n⚠️ Gradual dose titration essential — start low\\r\\n✅ Take with or without food\\r\\n⚠️ Monitor appetite and growth in children\\r\\n⚠️ Regular cardiac checkups recommended\\r\\n❌ Avoid caffeine — additive stimulant effect\\r\\n❌ This is a controlled substance — do NOT share\\r\",\"drugInteractions\":\"Methylphenidate + MAOIs:\\r\\n❌ Hypertensive crisis. Contraindicated.\\r\\n\\r\\nMethylphenidate + Warfarin, Anticonvulsants, Antidepressants:\\r\\n⚠️ May increase levels of these drugs. Monitor closely.\\r\\n\\r\\nAtomoxetine + MAOIs:\\r\\n❌ Serotonin Syndrome. Allow 2-week washout.\\r\"},{\"id\":\"rochetta-007\",\"title\":\"Alcohol Dependence \u0026 Withdrawal\",\"subtitle\":\"Compulsive use despite harm — withdrawal can be life-threatening\",\"content\":\"$15\",\"category\":\"Psychiatry\",\"chapterAr\":\"أعصاب / الطب النفسي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Diazepam 10mg tab | 12 ج.م: Valium 10mg tab | 35 ج.م, Diazepam Normon 10mg tab | 15 ج.م, Diazepex 10mg tab | 10 ج.م\\r\\nAcamprosate 333mg tab | 180 ج.م: Campral 333mg tab | 250 ج.م, Acamprosate Evalar 333mg tab | 200 ج.م, Acamprosate Sandoz 333mg tab | 160 ج.م\\r\\nNaltrexone 50mg tab | 350 ج.م: ReVia 50mg tab | 500 ج.م, Naltrexone Arrow 50mg tab | 300 ج.م, Naltrexone GPO 50mg tab | 280 ج.م\\r\",\"drugInstructions\":\"⚠️ Disulfiram: Absolutely NO alcohol — even in food, mouthwash, or perfume\\r\\n⚠️ Metronidazole: Avoid alcohol during treatment and 48 hours after\\r\\n⚠️ Naltrexone: Take only when completely opioid-free\\r\\n⚠️ Thiamine supplementation is essential — take daily\\r\\n⚠️ Regular liver function monitoring\\r\\n❌ Alcohol withdrawal can be life-threatening — never detox alone\\r\\n⚠️ Seek emergency care if seizures or confusion develop\\r\",\"drugInteractions\":\"Metronidazole + Alcohol:\\r\\n❌ Disulfiram-like reaction: nausea, vomiting, flushing, tachycardia. Avoid alcohol 48h after last dose.\\r\\n\\r\\nDisulfiram + Alcohol:\\r\\n❌ Severe reaction: hypotension, respiratory depression, death. Absolutely no alcohol.\\r\\n\\r\\nNaltrexone + Opioids:\\r\\n❌ Precipitates opioid withdrawal. Ensure opioid-free for 7-10 days.\\r\"},{\"id\":\"rochetta-008\",\"title\":\"Epilepsy\",\"subtitle\":\"Recurrent unprovoked seizures — AED selection by seizure type\",\"content\":\"$16\",\"category\":\"Psychiatry\",\"chapterAr\":\"أعصاب / الطب النفسي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Carbamazepine 200mg tab | 25 ج.م: Tegretol 200mg tab | 80 ج.م, Carbamazepine Genuiner 200mg tab | 30 ج.م, Zeptol 200mg tab | 20 ج.م\\r\\nValproic acid 300mg cap | 45 ج.م: Depakine 300mg cap | 120 ج.م, Valproic Acid Apotex 300mg cap | 50 ج.م, Convulex 300mg cap | 40 ج.م\\r\\nTopiramate 25mg tab | 60 ج.م: Topamax 25mg tab | 180 ج.م, Topiramate Arrow 25mg tab | 55 ج.م, Topirat 25mg tab | 45 ج.م\\r\",\"drugInstructions\":\"⚠️ NEVER stop AEDs suddenly — risk of seizures and status epilepticus\\r\\n⚠️ Take at the same time every day — consistent blood levels crucial\\r\\n⚠️ Avoid driving until seizure-free for at least 1 year\\r\\n⚠️ Report any rash immediately — especially with Lamotrigine\\r\\n⚠️ Women of childbearing age: take Folic Acid 5mg daily\\r\\n✅ Take with food to reduce GI upset\\r\\n❌ Avoid alcohol — lowers seizure threshold\\r\\n⚠️ Wear medical alert identification\\r\",\"drugInteractions\":\"Carbamazepine + Most drugs (OCPs, Warfarin, Doxycycline):\\r\\n❌ Strong CYP450 inducer — dramatically reduces effectiveness of many drugs including OCPs.\\r\\n\\r\\nValproic acid + Lamotrigine:\\r\\n⚠️ Risk of severe skin rash (SJS). Titrate Lamotrigine very slowly.\\r\\n\\r\\nPhenytoin + OCPs, Warfarin:\\r\\n❌ Reduces effectiveness. Alternative contraception needed.\\r\"},{\"id\":\"rochetta-009\",\"title\":\"Mild-Moderate Pain\",\"subtitle\":\"Headache, dental pain, sprains, post-op pain — paracetamol ± NSAIDs\",\"content\":\"$17\",\"category\":\"Pain \u0026 Analgesics\",\"chapterAr\":\"الألم والمسكنات\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Paracetamol 1g tab | 8 ج.م: Panadol 1g tab | 16 ج.م, Efferalgan 1g tab | 14 ج.م, Paracetamol El Kasr 1g tab | 6 ج.م\\r\\nIbuprofen 400mg tab | 15 ج.م: Brufen 400mg tab | 30 ج.م, Advil 400mg tab | 35 ج.م, Ibuprofen Apotex 400mg tab | 12 ج.م\\r\\nDiclofenac 50mg tab | 12 ج.م: Voltaren 50mg tab | 40 ج.م, Diclofenac Arrow 50mg tab | 10 ج.م, Cataflam 50mg tab | 55 ج.م\\r\",\"drugInstructions\":\"⚠️ Take WITH food to protect stomach\\r\\n⚠️ Use LOWEST effective dose for SHORTEST time\\r\\n⚠️ If age \u003e 65 or history of ulcer, add PPI\\r\\n⚠️ Max Paracetamol: 4g/day (2g if liver disease)\\r\\n❌ Do NOT take multiple NSAIDs together\\r\\n❌ Avoid if GFR \u003c 30\\r\\n⚠️ Report black/tarry stools or stomach pain immediately\\r\",\"drugInteractions\":\"NSAIDs + Warfarin/Anticoagulants:\\r\\n❌ Increased bleeding risk. Use Paracetamol instead.\\r\\n\\r\\nNSAIDs + ACE Inhibitors/ARBs:\\r\\n⚠️ Reduced BP control + renal damage. Avoid \\\"Triple Whammy\\\" with diuretics.\\r\\n\\r\\nNSAIDs + Lithium:\\r\\n⚠️ Increased lithium levels → toxicity.\\r\\n\\r\\nNSAIDs + SSRIs:\\r\\n⚠️ Increased GI bleeding risk. Add PPI.\\r\\n\\r\\nNSAIDs + Corticosteroids:\\r\\n⚠️ Synergistic GI ulcer/bleeding risk. Add PPI.\\r\"},{\"id\":\"rochetta-010\",\"title\":\"Neuropathic Pain\",\"subtitle\":\"Burning, shooting, tingling — diabetic neuropathy, post-herpetic, sciatica\",\"content\":\"$18\",\"category\":\"Pain \u0026 Analgesics\",\"chapterAr\":\"الألم والمسكنات\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Pregabalin 75mg cap | 85 ج.م: Lyrica 75mg cap | 200 ج.م, Pregabalin Arrow 75mg cap | 80 ج.م, Pregabalin GPO 75mg cap | 70 ج.م\\r\\nGabapentin 300mg cap | 55 ج.م: Neurontin 300mg cap | 160 ج.م, Gabapentin Sandoz 300mg cap | 60 ج.م, Gabapentin Apotex 300mg cap | 50 ج.م\\r\\nAmitriptyline 25mg tab | 10 ج.م: Tryptizol 25mg tab | 30 ج.م, Amitriptyline Arrow 25mg tab | 8 ج.م, Laroxyl 25mg tab | 45 ج.م\\r\",\"drugInstructions\":\"⚠️ Start LOW, go SLOW — gradual titration needed\\r\\n⚠️ May cause dizziness/drowsiness — especially first 2 weeks\\r\\n⚠️ Do NOT stop abruptly — taper over at least 1 week\\r\\n✅ Take with or without food\\r\\n⚠️ Amitriptyline: Take at bedtime\\r\\n⚠️ May cause weight gain with long-term use\\r\\n❌ Avoid alcohol — increases sedation\\r\",\"drugInteractions\":\"Pregabalin/Gabapentin + Opioids/Benzodiazepines:\\r\\n⚠️ Additive CNS depression. Use lowest doses.\\r\\n\\r\\nAmitriptyline + MAOIs:\\r\\n❌ Serotonin Syndrome. Contraindicated.\\r\\n\\r\\nAmitriptyline + SSRIs:\\r\\n⚠️ Increased sedation and anticholinergic effects.\\r\"},{\"id\":\"rochetta-011\",\"title\":\"Moderate-Severe Pain\",\"subtitle\":\"Tramadol, codeine — bridge between mild and strong opioids\",\"content\":\"[DIAGNOSIS]\\r\\n- NSAIDs/paracetamol alone insufficient\\r\\n- Post-surgical pain (first 48–72h)\\r\\n- Fractures, renal colic, severe dental\\r\\n- Step up from Step 1 → Step 2 WHO ladder\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Lab: CBC, LFTs, renal function, urine drug screen if abuse suspected\\r\\n- Special test: Pain assessment scale; review for substance misuse risk before opioids\\r\\n- Monitor: Respiratory rate, sedation level, pupil size, constipation on opioids\\r\\n- ECG: If combining Tramadol with SSRIs (serotonin syndrome risk)\\r\\n\\r\\n[TREATMENT]\\r\\n- Tramadol: 50-100mg QID — weak mu-agonist + SNRI\\r\\n- Codeine: 30-60mg QID — prodrug (CYP2D6)\\r\\n- Tramadol: seizure risk, serotonin syndrome\\r\\n- Codeine: avoid in children \u003c 12 (respiratory depression)\\r\\n\\r\\n[RX]\\r\\n- Tramadol 50mg cap (Tramadol HCl) | كبسولة مرتين أو 4 مرات يوميًا —最大 400mg/يوم | 30 ج.م\\r\\n- + Paracetamol 1g tab (Acetaminophen) | مع المتادول — تعزيز التأثير | 5 ج.م\\r\",\"category\":\"Pain \u0026 Analgesics\",\"chapterAr\":\"الألم والمسكنات\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Tramadol 50mg cap | 25 ج.م: Ultram 50mg cap | 65 ج.م, Tramal 50mg cap | 50 ج.م, Tramadol Arrow 50mg cap | 20 ج.م\\r\\nParacetamol 1g tab | 8 ج.م: Panadol 1g tab | 16 ج.م, Efferalgan 1g tab | 14 ج.م, Paracetamol El Kasr 1g tab | 6 ج.م\\r\",\"drugInstructions\":\"⚠️ Max Tramadol dose: 400mg/day — never exceed\\r\\n⚠️ Take with or without food\\r\\n⚠️ May cause dizziness, nausea, constipation\\r\\n⚠️ Do NOT drive or operate machinery\\r\\n❌ Avoid alcohol completely\\r\\n⚠️ Seizure risk at higher doses\\r\\n⚠️ Take Paracetamol as scheduled alongside for synergy\\r\",\"drugInteractions\":\"Tramadol + SSRIs/SNRIs:\\r\\n⚠️ Increased Serotonin Syndrome risk.\\r\\n\\r\\nTramadol + Benzodiazepines/Opioids:\\r\\n❌ Life-threatening respiratory depression. Avoid.\\r\\n\\r\\nTramadol + Carbamazepine:\\r\\n⚠️ Reduced Tramadol effectiveness.\\r\"},{\"id\":\"rochetta-012\",\"title\":\"Acute Gout\",\"subtitle\":\"Sudden onset monoarthritis — especially 1st MTP — crystal arthropathy\",\"content\":\"$19\",\"category\":\"Pain \u0026 Analgesics\",\"chapterAr\":\"الألم والمسكنات\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Colchicine 500mcg tab | 30 ج.م: Colchicine Sandoz 500mcg tab | 80 ج.م, Colchicine Arrow 500mcg tab | 25 ج.م, Colchimax 500mcg tab | 60 ج.م\\r\\nDiclofenac 50mg tab | 12 ج.م: Voltaren 50mg tab | 40 ج.م, Diclofenac Arrow 50mg tab | 10 ج.م, Cataflam 50mg tab | 55 ج.م\\r\\nAllopurinol 100mg tab | 18 ج.م: Zyloprim 100mg tab | 60 ج.م, Allopurinol Apotex 100mg tab | 20 ج.م, Allurit 100mg tab | 15 ج.م\\r\",\"drugInstructions\":\"⚠️ Allopurinol: Start 2-4 weeks AFTER attack settles\\r\\n⚠️ Colchicine: Take at FIRST sign of attack — most effective within 12h\\r\\n⚠️ Colchicine max: 6mg total per attack\\r\\n⚠️ Maintain high fluid intake (2-3L/day)\\r\\n✅ Take with food\\r\\n❌ Avoid alcohol — increases uric acid\\r\\n❌ Avoid organ meats, red meat, beer\\r\\n⚠️ Report rash, mouth sores, or fever (serious side effects)\\r\",\"drugInteractions\":\"Allopurinol + Azathioprine/6-MP:\\r\\n❌↑↑↑ Life-threatening bone marrow suppression. Reduce Azathioprine by 75% or avoid.\\r\\n\\r\\nColchicine + Clarithromycin/Erythromycin:\\r\\n❌↑↑↑ Fatal toxicity (especially with renal impairment). Avoid completely.\\r\"},{\"id\":\"rochetta-013\",\"title\":\"Fibromyalgia\",\"subtitle\":\"Widespread chronic pain + fatigue — diagnosis of exclusion\",\"content\":\"[DIAGNOSIS]\\r\\n- Widespread pain ≥ 3 months in all 4 quadrants\\r\\n- 18 tender points on examination\\r\\n- Associated: fatigue, sleep disturbance, IBS, depression\\r\\n- Diagnosis of exclusion — investigate first\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Lab: CBC, TSH, FBS, ESR/CRP, LFTs — exclude autoimmune, thyroid, metabolic causes\\r\\n- Special test: Tender point count (18-point exam), FIQ (Fibromyalgia Impact Questionnaire)\\r\\n- Monitor: Pain score, sleep quality, fatigue level, depression (PHQ-9) at each visit\\r\\n- Imaging: X-ray affected joints if mechanical pathology suspected\\r\\n\\r\\n[TREATMENT]\\r\\n- Pharmacological: Pregabalin, Duloxetine, or Amitriptyline\\r\\n- Non-pharmacological: Exercise, sleep hygiene, CBT\\r\\n- Avoid: NSAIDs alone, opioids — minimal benefit\\r\\n\\r\\n[RX]\\r\\n- Pregabalin 75mg cap (Pregabalin) | كبسولة مرتين يوميًا — تزاد إلى 150mg مرتين | 74 ج.م\\r\\n- OR Duloxetine 30mg cap (Duloxetine) | كبسولة مرة واحدة يوميًا × أسبوع ثم 60mg | 243 ج.م\\r\\n- OR Amitriptyline 10mg tab (Amitriptyline HCl) | قرص قبل النوم — تزاد تدريجيًا إلى 50mg | 25.5 ج.م\\r\",\"category\":\"Pain \u0026 Analgesics\",\"chapterAr\":\"الألم والمسكنات\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Pregabalin 75mg cap | 85 ج.م: Lyrica 75mg cap | 200 ج.م, Pregabalin Arrow 75mg cap | 80 ج.م, Pregabalin GPO 75mg cap | 70 ج.م\\r\\nDuloxetine 30mg cap | 120 ج.م: Cymbalta 30mg cap | 300 ج.م, Duloxetine Arrow 30mg cap | 110 ج.م, Duloxetine GPO 30mg cap | 100 ج.م\\r\\nAmitriptyline 10mg tab | 8 ج.م: Tryptizol 10mg tab | 25 ج.م, Amitriptyline Arrow 10mg tab | 7 ج.م, Elavil 10mg tab | 35 ج.م\\r\",\"drugInstructions\":\"⚠️ Start LOW, go SLOW — gradual titration\\r\\n⚠️ Takes 2-4 weeks to notice benefit\\r\\n⚠️ Exercise is essential alongside medication — start gentle, progress\\r\\n✅ Take with or without food\\r\\n⚠️ Amitriptyline: Take at bedtime\\r\\n⚠️ May cause drowsiness — avoid driving initially\\r\\n❌ Avoid alcohol\\r\",\"drugInteractions\":\"Pregabalin/Gabapentin + Opioids/Benzodiazepines:\\r\\n⚠️ Additive CNS depression.\\r\\n\\r\\nDuloxetine + MAOIs:\\r\\n❌ Serotonin Syndrome. Contraindicated.\\r\\n\\r\\nAmitriptyline + SSRIs:\\r\\n⚠️ Increased sedation.\\r\"},{\"id\":\"rochetta-014\",\"title\":\"Migraine\",\"subtitle\":\"Unilateral throbbing headache ± aura, photophobia, nausea\",\"content\":\"$1a\",\"category\":\"Pain \u0026 Analgesics\",\"chapterAr\":\"الألم والمسكنات\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Paracetamol 1g tab | 8 ج.م: Panadol 1g tab | 16 ج.م, Efferalgan 1g tab | 14 ج.م, Doliprane 1g tab | 12 ج.م\\r\\nIbuprofen 400mg tab | 15 ج.م: Brufen 400mg tab | 30 ج.م, Advil 400mg tab | 35 ج.م, Ibuprofen GPO 400mg tab | 12 ج.م\\r\\nSumatriptan 50mg tab | 90 ج.م: Imigran 50mg tab | 200 ج.م, Sumatriptan Arrow 50mg tab | 80 ج.م, Relpax 40mg tab | 250 ج.م\\r\\nPropranolol 40mg tab | 15 ج.م: Inderal 40mg tab | 50 ج.م, Propranolol Sandoz 40mg tab | 12 ج.م, Propranolol Apotex 40mg tab | 10 ج.م\\r\\nAmitriptyline 10mg tab | 8 ج.م: Tryptizol 10mg tab | 25 ج.م, Amitriptyline Arrow 10mg tab | 7 ج.م, Endep 10mg tab | 30 ج.م\\r\",\"drugInstructions\":\"⚠️ Sumatriptan: Take at EARLIEST sign of migraine — most effective within 1h\\r\\n⚠️ Max 2 doses in 24 hours\\r\\n⚠️ Propranolol (prophylaxis): Takes 2-4 weeks for full effect\\r\\n⚠️ Propranolol: Do NOT stop suddenly — taper over 1-2 weeks\\r\\n✅ Take Paracetamol + Ibuprofen at onset for best results\\r\\n❌ Avoid alcohol, chocolate, aged cheese — triggers\\r\\n⚠️ If asthmatic: use Amlodipine instead of Propranolol\\r\",\"drugInteractions\":\"Triptans + SSRIs/MAOIs:\\r\\n⚠️ Serotonin Syndrome risk. Monitor but may be used with caution.\\r\\n\\r\\nPropranolol + Verapamil/Diltiazem:\\r\\n❌ Severe bradycardia, heart block, heart failure.\\r\\n\\r\\nPropranolol + Insulin/Sulfonylureas:\\r\\n⚠️ Masks hypoglycemia symptoms. Monitor glucose closely.\\r\"},{\"id\":\"rochetta-015\",\"title\":\"Renal Colic\",\"subtitle\":\"Severe loin-to-groin pain — ureteric stone\",\"content\":\"$1b\",\"category\":\"Pain \u0026 Analgesics\",\"chapterAr\":\"الألم والمسكنات\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Drotaverine 80mg tab | 20 ج.م: No-Spa 80mg tab | 60 ج.م, Drotaverine Sandoz 80mg tab | 18 ج.م, Drotaverine GPO 80mg tab | 15 ج.م\\r\\nDiclofenac 75mg IM | 35 ج.م: Voltaren 75mg IM | 80 ج.م, Diclofenac Arrow 75mg IM | 30 ج.م, Cataflam 75mg IM | 100 ج.م\\r\\nTamsulosin 0.4mg cap | 70 ج.م: Omnic 0.4mg cap | 180 ج.م, Tamsulosin Arrow 0.4mg cap | 65 ج.م, Flomax 0.4mg cap | 200 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-016\",\"title\":\"Osteoarthritis\",\"subtitle\":\"Mechanical joint pain, stiffness, reduced function — most common arthritis\",\"content\":\"[DIAGNOSIS]\\r\\n- Weight-bearing joint pain worse with activity\\r\\n- Morning stiffness \u003c 30 min (vs RA \u003e 1h)\\r\\n- Crepitus, bony swelling, reduced ROM\\r\\n- X-ray: joint space narrowing, osteophytes\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Imaging: Weight-bearing X-ray of affected joint (Kellgren–Lawrence grading)\\r\\n- Lab: ESR/CRP, RF, anti-CCP — exclude inflammatory arthritis\\r\\n- Special test: Functional assessment — ROM measurement, gait analysis, ADL scoring\\r\\n- Monitor: Pain score (VAS), functional status, BMI (weight management)\\r\\n\\r\\n[TREATMENT]\\r\\n- Non-pharm: Weight loss, exercise, physiotherapy\\r\\n- Topical: NSAID gel (Diclofenac gel) — 1st line\\r\\n- Oral: Paracetamol ± oral NSAID + PPI\\r\\n- Intra-articular: Steroid injection — moderate relief\\r\\n\\r\\n[RX]\\r\\n- Paracetamol 1g tab (Acetaminophen) | قرص مرتين أو 3 مرات يوميًا — الخط الأول | 5 ج.م\\r\\n- Diclofenac gel (Diclofenac Diethylamine) | طلة على المفصل المصاب 3-4 مرات يوميًا | —\\r\\n- OR Celecoxib 200mg cap (Celecoxib) | كبسولة مرة أو مرتين يوميًا — GI safer | 94 ج.م\\r\",\"category\":\"Pain \u0026 Analgesics\",\"chapterAr\":\"الألم والمسكنات\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Paracetamol 1g tab | 8 ج.م: Panadol 1g tab | 16 ج.م, Efferalgan 1g tab | 14 ج.م, Paracetamol El Kasr 1g tab | 6 ج.م\\r\\nDiclofenac gel | 30 ج.م: Voltaren Emulgel | 85 ج.م, Diclofenac Gel Apotex | 25 ج.م, Cataflam Emulgel | 95 ج.م\\r\\nCelecoxib 200mg cap | 80 ج.م: Celebrex 200mg cap | 220 ج.م, Celecoxib Arrow 200mg cap | 75 ج.م, Celcoxx 200mg cap | 65 ج.م\\r\",\"drugInstructions\":\"⚠️ NSAIDs: Take WITH food, lowest dose, shortest time\\r\\n⚠️ Diclofenac gel: Apply to affected joints — can use with oral NSAIDs for added effect\\r\\n⚠️ Weight loss and exercise are the most effective long-term treatments\\r\\n⚠️ Paracetamol: First-line — try this before NSAIDs\\r\\n⚠️ Celecoxib: Take with food\\r\\n❌ Do NOT combine multiple NSAIDs\\r\\n⚠️ Report stomach pain or dark stools\\r\",\"drugInteractions\":\"NSAIDs: See Mild-Moderate Pain interactions above.\\r\\n\\r\\nCelecoxib + Warfarin:\\r\\n⚠️ Increased bleeding risk. Monitor INR.\\r\\n\\r\\nCelecoxib + CYP2C9 inhibitors (Fluconazole):\\r\\n⚠️ Increased Celecoxib levels. Reduce dose.\\r\"},{\"id\":\"rochetta-017\",\"title\":\"Upper RTI / Pharyngitis\",\"subtitle\":\"Sore throat, fever, cough — mostly viral, selective antibiotics\",\"content\":\"[DIAGNOSIS]\\r\\n- Centor score: fever, tonsillar exudates, tender ALN, no cough\\r\\n- Score 0–1: viral → symptomatic only\\r\\n- Score 2–3: consider rapid strep test\\r\\n- Score 4: empirical Penicillin / Amoxicillin\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Culture: Rapid strep test or throat culture if Centor ≥ 2\\r\\n- Lab: CBC, CRP — distinguish viral vs bacterial if uncertain\\r\\n- Special test: Centor score calculation; no routine imaging for simple URTI\\r\\n- Monitor: Symptom resolution at 48–72h; reassess if worsening\\r\\n\\r\\n[TREATMENT]\\r\\n- Most URTIs are viral — NO antibiotics\\r\\n- Use narrowest spectrum possible\\r\\n- Prescribe for shortest effective duration\\r\\n- Never use fluoroquinolones for simple infections\\r\\n- Penicillin allergy → macrolide or doxycycline\\r\\n- Duration: 5–7 days (not 10–14)\\r\\n\\r\\n[RX-الروشتة — If bacterial confirmed]\\r\\n- Amoxicillin 1g tab (Amoxicillin) | قرص 3 مرات يوميًا × 5-7 أيام — الخط الأول | 43.5 ج.م\\r\\n- OR Azithromycin 250mg tab (Azithromycin) | قرص مرة واحدة يوميًا × 3 أيام — بديل حساسية البنسلين | 49.5 ج.م\\r\",\"category\":\"Antibiotics\",\"chapterAr\":\"المضادات الحيوية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Amoxicillin 1g tab | 30 ج.م: Amoxil 1g tab | 75 ج.م, Ospamox 1g tab | 80 ج.م, Amoxicillin Arrow 1g tab | 25 ج.م\\r\\nAzithromycin 250mg tab | 45 ج.م: Zithromax 250mg tab | 120 ج.م, Azee 250mg tab | 60 ج.م, Azithromycin GPO 250mg tab | 35 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-018\",\"title\":\"Community-Acquired Pneumonia\",\"subtitle\":\"Productive cough, fever, pleuritic chest pain, consolidation on CXR\",\"content\":\"$1c\",\"category\":\"Antibiotics\",\"chapterAr\":\"المضادات الحيوية\",\"alternatives\":\"Augmentin 625mg tab | 45 ج.م\\nAzithromycin 500mg tab | 35 ج.م\\nLevofloxacin 500mg tab | 85 ج.م\\nCeftriaxone 1g vial | 28 ج.م\",\"perDrugAlternatives\":\"Amoxicillin/Clav 625mg tab | 45 ج.م: Augmentin 625mg tab | 45 ج.م, Amoclav 625mg tab | 35 ج.م, Clavam 625mg tab | 30 ج.م\\nAzithromycin 500mg tab | 35 ج.م: Zithromax 500mg tab | 55 ج.م, Azee 500mg tab | 28 ج.م, Azitro 500mg tab | 22 ج.م\\nLevofloxacin 500mg tab | 85 ج.م: Levaquin 500mg tab | 120 ج.م, Leflox 500mg tab | 65 ج.م, Levozine 500mg tab | 55 ج.م\\nCeftriaxone 1g vial | 28 ج.م: Rocephin 1g vial | 55 ج.م, Ceftriax 1g vial | 22 ج.م, Cefaxone 1g vial | 18 ج.م\",\"drugInstructions\":\"⚠️ Complete FULL antibiotic course — critical for pneumonia\\r\\n⚠️ Augmentin: Take with food to reduce GI upset\\r\\n⚠️ Azithromycin: Take 1h before or 2h after food\\r\\n✅ Take Paracetamol regularly for fever\\r\\n✅ Drink plenty of fluids — helps thin secretions\\r\\n⚠️ If not improving in 48-72h, return to doctor\\r\\n⚠️ Fluimucil: Dissolve in water, drink immediately\\r\\n❌ Do NOT use leftover antibiotics from previous illness\\r\",\"drugInteractions\":\"Clarithromycin + Statins (Simvastatin, Atorvastatin):\\r\\n❌↑↑ Rhabdomyolysis risk. Stop statin during Clarithromycin course.\\r\\n\\r\\nClarithromycin + Warfarin:\\r\\n⚠️ Increased INR. Monitor every 3-5 days.\\r\"},{\"id\":\"rochetta-019\",\"title\":\"Acute Bacterial Sinusitis\",\"subtitle\":\"Facial pain, purulent nasal discharge, nasal obstruction \u003e 10 days\",\"content\":\"[DIAGNOSIS]\\r\\n- Persistent symptoms \u003e 10 days without improvement\\r\\n- \\\"Double worsening\\\" — initial improvement then deterioration\\r\\n- Severe symptoms \u003e 3–4 days with high fever\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Imaging: CT sinuses (water–bone window) if recurrent or refractory; plain X-ray (OP view) shows air-fluid levels\\r\\n- Lab: CBC, CRP — assess severity of bacterial infection\\r\\n- Culture: Nasal endoscopy with swab if purulent drainage; allergy testing if chronic\\r\\n- Monitor: Symptom resolution at 7–10 days; treatment response\\r\\n\\r\\n[TREATMENT]\\r\\n- Mild: Nasal saline + decongestant × 5–7 days\\r\\n- Moderate: Amoxicillin 1g TDS × 5–7 days\\r\\n- Severe / Refractory: Augmentin 1g BID × 7 days\\r\\n- Add intranasal corticosteroid (Fluticasone)\\r\\n\\r\\n[RX]\\r\\n- Amoxicillin 1g tab (Amoxicillin) | قرص 3 مرات يوميًا × 5-7 أيام | 43.5 ج.م\\r\\n- OR Augmentin 1g tab (Amoxicillin+Clavulanate) | قرص مرتين يوميًا × 7 أيام | 210 ج.م\\r\\n- + Paracetamol 1g tab (Acetaminophen) | قرص مرتين أو 3 مرات يوميًا للألم والحمى | 5 ج.م\\r\",\"category\":\"Antibiotics\",\"chapterAr\":\"المضادات الحيوية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Amoxicillin 1g tab | 30 ج.م: Amoxil 1g tab | 75 ج.م, Ospamox 1g tab | 80 ج.م, Amoxicillin Sandoz 1g tab | 28 ج.م\\r\\nAugmentin 1g tab | 80 ج.م: Augmentin ES 643mg | 95 ج.م, Amoxicillin+Clavulanate Arrow 1g | 70 ج.م, Moxatag 1g tab | 110 ج.م\\r\\nParacetamol 1g tab | 8 ج.م: Panadol 1g tab | 16 ج.م, Efferalgan 1g tab | 14 ج.م, Paracetamol El Kasr 1g tab | 6 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-020\",\"title\":\"Uncomplicated Lower UTI\",\"subtitle\":\"Dysuria, frequency, urgency — E. coli most common pathogen\",\"content\":\"$1d\",\"category\":\"Antibiotics\",\"chapterAr\":\"المضادات الحيوية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Nitrofurantoin 100mg tab | 25 ج.م: Macrodantin 100mg tab | 90 ج.م, Nitrofurantoin Arrow 100mg tab | 20 ج.م, Nitrofurantoin GPO 100mg tab | 18 ج.م\\r\\nFosfomycin 3g sachet | 65 ج.م: Monurol 3g sachet | 140 ج.م, Fosfomycin Teva 3g sachet | 55 ج.م, Fosfomycin Sandoz 3g sachet | 50 ج.م\\r\\nCiprofloxacin 500mg tab | 35 ج.م: Cipro 500mg tab | 90 ج.م, Ciprofloxacin Arrow 500mg tab | 30 ج.م, Ciproxina 500mg tab | 80 ج.م\\r\",\"drugInstructions\":\"⚠️ Nitrofurantoin: Take WITH food — improves absorption\\r\\n⚠️ Complete full 5-day course\\r\\n⚠️ Fosfomycin: Mix in cold water, drink immediately — single dose only\\r\\n⚠️ Not effective for upper UTI (pyelonephritis)\\r\\n✅ Drink plenty of water\\r\\n⚠️ Phenazopyridine: May turn urine orange/red — normal\\r\\n⚠️ Remove contact lenses before Phenazopyridine\\r\",\"drugInteractions\":\"Fluoroquinolones (Ciprofloxacin) + Antacids/Iron/Calcium:\\r\\n❌ Severely reduced absorption. Space 2-4 hours.\\r\\n\\r\\nNitrofurantoin + Antacids (Mg-containing):\\r\\n⚠️ May reduce absorption.\\r\"},{\"id\":\"rochetta-021\",\"title\":\"Cellulitis \u0026 SSTI\",\"subtitle\":\"Spreading skin infection — erythema, warmth, tenderness, lymphangitis\",\"content\":\"[DIAGNOSIS]\\r\\n- Spreading erythema with well-defined border\\r\\n- Warmth, tenderness, edema\\r\\n- Lymphangitis (red streaking) — lymphadenopathy\\r\\n- Look for portal of entry: cracks, eczema, ulcers\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Lab: CBC, CRP/ESR, blood cultures if systemic toxicity\\r\\n- Culture: Wound swab for culture and sensitivity if pus or non-resolving\\r\\n- Monitor: Temperature, erythema borders (mark with pen), WCC, renal function\\r\\n- Imaging: Ultrasound if abscess suspected (fluctuance, pointing)\\r\\n\\r\\n[TREATMENT]\\r\\n- Mild (oral): Flucloxacillin or Cephalexin × 7 days\\r\\n- Moderate: IV Flucloxacillin or Ceftriaxone\\r\\n- Penicillin allergy: Clindamycin or Doxycycline\\r\\n\\r\\n[RX]\\r\\n- Cephalexin 500mg cap (Cefalexin) | كبسولة 4 مرات يوميًا × 7 أيام | 5.28 ج.م\\r\\n- OR Ceftriaxone 1g IM (Ceftriaxone) | حقن عضلي مرة واحدة يوميًا — حالات شديدة | 69 ج.م\\r\\n- + Ibuprofen 400mg tab (Ibuprofen) | قرص 3 مرات يوميًا بعد الأكل | 6 ج.م\\r\",\"category\":\"Antibiotics\",\"chapterAr\":\"المضادات الحيوية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Cephalexin 500mg cap | 30 ج.م: Keflex 500mg cap | 100 ج.م, Cephalexin Arrow 500mg cap | 25 ج.م, Cephalexin GPO 500mg cap | 22 ج.م\\r\\nCeftriaxone 1g IM | 50 ج.م: Rocephin 1g IM | 120 ج.م, Ceftriaxone Arrow 1g IM | 45 ج.م, Ceftriaxone Sandoz 1g IM | 40 ج.م\\r\\nIbuprofen 400mg tab | 15 ج.م: Brufen 400mg tab | 30 ج.م, Advil 400mg tab | 35 ج.م, Ibuprofen Apotex 400mg tab | 12 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-022\",\"title\":\"H. pylori Eradication\",\"subtitle\":\"Dyspepsia, epigastric pain — triple/quadruple therapy\",\"content\":\"$1e\",\"category\":\"GIT\",\"chapterAr\":\"الجهاز الهضمي\",\"alternatives\":\"\",\"perDrugAlternatives\":\"$1f\",\"drugInstructions\":\"⚠️ Complete ALL 14 days — eradication depends on full course\\r\\n⚠️ PPI: Take 30-60 min BEFORE meals for maximum effect\\r\\n⚠️ Amoxicillin + Clarithromycin: Take WITH food\\r\\n⚠️ Metronidazole: Do NOT drink alcohol — severe nausea/vomiting\\r\\n⚠️ Avoid alcohol for 48h after last Metronidazole dose\\r\\n⚠️ Repeat urea breath test 4 weeks after finishing\\r\\n❌ Do NOT skip doses — promotes resistance\\r\",\"drugInteractions\":\"Clarithromycin + Statins (Simvastatin):\\r\\n❌↑↑ Rhabdomyolysis risk. Stop statin during treatment.\\r\\n\\r\\nPPI (Omeprazole) + Clopidogrel:\\r\\n❌ Reduced antiplatelet effect. Use Pantoprazole instead.\\r\\n\\r\\nMetronidazole + Alcohol:\\r\\n❌ Disulfiram-like reaction. Avoid alcohol 48h after last dose.\\r\"},{\"id\":\"rochetta-023\",\"title\":\"Hospital-Acquired Infection\",\"subtitle\":\"HAP/VAP, UTI, Bacteremia — broad-spectrum empirical therapy\",\"content\":\"[DIAGNOSIS]\\r\\n- Most common: MRSA, Pseudomonas, ESBL organisms\\r\\n- Check local antibiogram before prescribing\\r\\n- Obtain cultures BEFORE starting antibiotics\\r\\n- De-escalate once sensitivities available\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Culture: Blood cultures ×2 (before antibiotics), sputum/urine/wound cultures as site-appropriate\\r\\n- Lab: CBC, CRP/PCT, renal function, LFTs, electrolytes\\r\\n- Special test: Antibiotic sensitivity results to guide de-escalation; procalcitonin for stewardship\\r\\n- Monitor: Temperature curve, WCC, CRP trend, renal function daily\\r\\n\\r\\n[TREATMENT]\\r\\n- HAP/VAP: Piperacillin-Tazobactam or Meropenem\\r\\n- Gram-positive: Vancomycin — MRSA coverage\\r\\n- Neutropenic sepsis: Meropenem ± Vancomycin\\r\\n\\r\\n[RX-الروشتة — HAP (empirical)]\\r\\n- Ceftriaxone 2g IV (Ceftriaxone) | infusion once daily | 69 ج.م\\r\\n- + Azithromycin 500mg IV (Azithromycin) | infusion once daily | 53 ج.م\\r\\n\\r\\n[RX-الروشتة — MRSA coverage]\\r\\n- Vancomycin 1g IV (Vancomycin) | infusion over 60 min — needs TDM | 204 ج.م\\r\",\"category\":\"Antibiotics\",\"chapterAr\":\"المضادات الحيوية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Ceftriaxone 2g IV | 90 ج.م: Rocephin 2g IV | 250 ج.م, Ceftriaxone Arrow 2g IV | 80 ج.م, Ceftriaxone Sandoz 2g IV | 70 ج.م\\r\\nAzithromycin 500mg IV | 75 ج.م: Zithromax 500mg IV | 180 ج.م, Azithromycin GPO 500mg IV | 60 ج.م, Azee 500mg IV | 65 ج.م\\r\\nVancomycin 1g IV | 200 ج.م: Vancocin 1g IV | 450 ج.م, Vancomycin Teva 1g IV | 180 ج.م, Vancomycin Sandoz 1g IV | 160 ج.م\\r\",\"drugInstructions\":\"⚠️ Vancomycin: Needs TDM (therapeutic drug monitoring) — blood levels must be checked\\r\\n⚠️ Aminoglycosides: Monitor renal function and drug levels\\r\\n⚠️ Obtain cultures BEFORE starting antibiotics\\r\\n⚠️ De-escalate once sensitivities available — narrow spectrum\\r\\n⚠️ Never mix Vancomycin with other drugs in same IV line\\r\\n⚠️ Report hearing changes or tinnitus (aminoglycoside toxicity)\\r\",\"drugInteractions\":\"Aminoglycosides + Loop diuretics (Furosemide):\\r\\n⚠️↑ Nephrotoxic/Ototoxicity. Monitor levels closely.\\r\\n\\r\\nVancomycin + Aminoglycosides:\\r\\n⚠️ Additive nephrotoxicity. Monitor renal function.\\r\\n\\r\\nRifampin + Most drugs (OCPs, Warfarin):\\r\\n❌↓↓ Strong CYP450 inducer — reduces effectiveness of many drugs.\\r\"},{\"id\":\"rochetta-024\",\"title\":\"STI — Gonorrhea \u0026 Chlamydia\",\"subtitle\":\"Urethral/vaginal discharge, dysuria — dual therapy approach\",\"content\":\"[DIAGNOSIS]\\r\\n- Gonorrhea: Mucopurulent discharge, dysuria\\r\\n- Chlamydia: Often asymptomatic — screened\\r\\n- Co-infection common — treat both simultaneously\\r\\n- Contact tracing essential\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Culture: NAAT from urethral/cervical/pharyngeal/rectal swabs (gonorrhoea + chlamydia)\\r\\n- Lab: HIV serology, RPR/VDRL (syphilis), HBsAg, hepatitis C antibody\\r\\n- Special test: Test of cure at 2 weeks; repeat STI screen at 3 months\\r\\n- Monitor: Partner treatment completion, symptom resolution, reinfection\\r\\n\\r\\n[TREATMENT]\\r\\n- Gonorrhea: Ceftriaxone 500mg IM single dose\\r\\n- Chlamydia: Doxycycline 100mg BID × 7 days\\r\\n- Pregnancy: Azithromycin 1g single dose\\r\\n- Follow-up: Test of cure at 2 weeks\\r\\n\\r\\n[RX]\\r\\n- Ceftriaxone 500mg IM (Ceftriaxone) | حقنة عضلي واحدة | 69 ج.م\\r\\n- + Doxycycline 100mg cap (Doxycycline) | كبسولة مرتين يوميًا × 7 أيام | 12 ج.م\\r\",\"category\":\"Antibiotics\",\"chapterAr\":\"المضادات الحيوية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Ceftriaxone 500mg IM | 40 ج.م: Rocephin 500mg IM | 100 ج.م, Ceftriaxone Arrow 500mg IM | 35 ج.م, Ceftriaxone GPO 500mg IM | 30 ج.م\\r\\nDoxycycline 100mg cap | 20 ج.م: Vibramycin 100mg cap | 80 ج.م, Doxycycline Arrow 100mg cap | 15 ج.م, Doxycycline Sandoz 100mg cap | 12 ج.م\\r\",\"drugInstructions\":\"⚠️ Doxycycline: Take with full glass of water — sit upright 30 min after\\r\\n⚠️ Avoid lying down immediately (esophageal irritation)\\r\\n⚠️ Doxycycline: Avoid excessive sun — photosensitivity\\r\\n⚠️ Do NOT have sex until both partners complete treatment\\r\\n✅ Take Doxycycline with food if stomach upset\\r\\n⚠️ All sexual contacts must be notified and treated\\r\\n⚠️ Test of cure at 2 weeks\\r\",\"drugInteractions\":\"Ceftriaxone + Calcium-containing IV solutions:\\r\\n❌ Precipitation. Never mix.\\r\\n\\r\\nDoxycycline + Antacids/Iron/Calcium/Dairy:\\r\\n⚠️ Reduced absorption. Space 2-4 hours.\\r\"},{\"id\":\"rochetta-025\",\"title\":\"Acne Vulgaris\",\"subtitle\":\"Comedones, papules, pustules — especially in adolescents and young adults\",\"content\":\"$20\",\"category\":\"Dermatology\",\"chapterAr\":\"الأمراض الجلدية\",\"alternatives\":\"Retin-A 0.05% cream | 45 ج.م\\nBenzoyl Peroxide 5% gel | 28 ج.م\\nDoxycycline 100mg cap | 15 ج.م\\nIsotretinoin 20mg cap | 120 ج.م\",\"perDrugAlternatives\":\"Tretinoin 0.05% cream | 45 ج.م: Retin-A 0.05% cream | 45 ج.م, Stieva-A 0.05% cream | 35 ج.م, Tretin 0.05% cream | 28 ج.م\\nBenzoyl Peroxide 5% gel | 28 ج.م: PanOxyl 5% gel | 42 ج.م, Acnecide 5% gel | 55 ج.م, Benzac AC 5% gel | 38 ج.م\\nDoxycycline 100mg cap | 15 ج.م: Vibramycin 100mg cap | 25 ج.م, Doxy 100mg cap | 12 ج.م, Dorix 100mg cap | 10 ج.م\\nIsotretinoin 20mg cap | 120 ج.م: Roaccutane 20mg cap | 185 ج.م, Acnotin 20mg cap | 95 ج.م, Isotane 20mg cap | 80 ج.م\",\"drugInstructions\":\"⚠️ Isotretinoin: CONTRACEPTION MANDATORY — teratogenic\\r\\n⚠️ Start contraception 1 month before, during, and 1 month after\\r\\n⚠️ Monthly pregnancy tests for females\\r\\n⚠️ Monthly LFT and lipid monitoring on Isotretinoin\\r\\n⚠️ Doxycycline: Take with food, avoid sun exposure\\r\\n✅ Adapalene: Apply thin layer at NIGHT\\r\\n✅ Benzoyl Peroxide: Apply morning and evening — can bleach fabrics\\r\\n⚠️ Initial worsening with retinoids is normal (2-4 weeks)\\r\\n❌ Do NOT take Vitamin A supplements on Isotretinoin\\r\\n⚠️ Moisturize regularly — dry skin/lips very common\\r\",\"drugInteractions\":\"Doxycycline + Antacids/Iron/Calcium/Dairy:\\r\\n⚠️ Reduced absorption. Space 2-4 hours.\\r\\n\\r\\nDoxycycline + Oral Contraceptives:\\r\\n⚠️ May reduce OCP effectiveness. Use additional contraception.\\r\\n\\r\\nIsotretinoin + Vitamin A supplements:\\r\\n❌↑↑ Hypervitaminosis A. Stop all Vitamin A supplements.\\r\\n\\r\\nIsotretinoin + Tetracyclines (Doxycycline):\\r\\n❌ Increased intracranial pressure (pseudotumor cerebri). NEVER combine.\\r\"},{\"id\":\"rochetta-026\",\"title\":\"Atopic Dermatitis\",\"subtitle\":\"Pruritic, erythematous, scaly plaques — relapsing course\",\"content\":\"[DIAGNOSIS]\\r\\n- Intense pruritus — worsening at night\\r\\n- Flexural involvement (antecubital, popliteal)\\r\\n- Asthma / allergic rhinitis association (atopic triad)\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Lab: CBC (eosinophilia), IgE level, FBS — screen for atopy\\r\\n- Special test: Skin prick testing or specific IgE for allergen identification; TARC level\\r\\n- Monitor: EASI/SCORAD score, SCORING quality of life, infection markers (secondary infection)\\r\\n- Culture: Skin swab if secondary bacterial infection suspected (weeping, crusting)\\r\\n\\r\\n[TREATMENT]\\r\\n- Emollients — foundation (daily)\\r\\n- Mild TCS: Hydrocortisone 1% (acute flares)\\r\\n- Moderate TCS: Betamethasone (severe)\\r\\n- Calcineurin inhibitors: Tacrolimus (face)\\r\\n\\r\\n[RX]\\r\\n- Hydrocortisone acetate 1% cream (Hydrocortisone) | طبقة رقيقة على المناطق المصابة مرتين يوميًا × 7-14 يومًا | 8 ج.م\\r\\n- Emollient cream (Cetaphil / CeraVe) | كمية سخية 3 مرات يوميًا — основة العلاج | —\\r\\n- OR Betamethasone 0.1% cream (Betamethasone Valerate) | للبالغين — حالات شديدة | 49 ج.م\\r\",\"category\":\"Dermatology\",\"chapterAr\":\"الأمراض الجلدية\",\"alternatives\":\"Hydrocortisone 1% cream | 12 ج.م\\nElocon 0.1% cream | 25 ج.م\\nProtopic 0.1% oint | 165 ج.م\\nLocoid 0.1% cream | 35 ج.م\",\"perDrugAlternatives\":\"Hydrocortisone 1% cream | 12 ج.م: Synacort 1% cream | 15 ج.م, Cortaid 1% cream | 10 ج.م, Hydrocort 1% cream | 8 ج.م\\nMometasone 0.1% cream | 25 ج.م: Elocon 0.1% cream | 25 ج.م, Dermovate 0.05% cream | 22 ج.م, Momate 0.1% cream | 18 ج.م\\nTacrolimus 0.1% oint | 165 ج.م: Protopic 0.1% oint | 165 ج.م, Tacrolimus 0.1% oint | 110 ج.م, Tacroz 0.1% oint | 95 ج.م\\nHydrocortisone butyrate 0.1% | 35 ج.م: Locoid 0.1% cream | 35 ج.م, Locoid Crelo 0.1% cream | 42 ج.م, Pandel 0.1% cream | 30 ج.م\",\"drugInstructions\":\"⚠️ Emollients: Apply liberally and frequently — foundation of treatment\\r\\n⚠️ Hydrocortisone 1%: Apply thin layer, affected areas only, 7-14 days max\\r\\n⚠️ Betamethasone: Potent — avoid face, groin, axillae\\r\\n⚠️ Tacrolimus: Safe for face and flexures — apply thin layer twice daily\\r\\n⚠️ Avoid long-term continuous steroid use on same area (skin thinning)\\r\\n✅ Apply emollient first, wait 10 min, then steroid\\r\\n⚠️ Wet wrap therapy can enhance absorption in severe flares\\r\\n❌ Avoid known irritants: soap, fragrances, wool\\r\",\"drugInteractions\":\"Topical corticosteroids + NSAIDs:\\r\\n⚠️↑ GI ulcer risk if on systemic steroids. Rare with topical alone.\\r\\n\\r\\nTacrolimus + Live vaccines:\\r\\n⚠️ Avoid live vaccines during treatment.\\r\\n\\r\\nBetamethasone (potent) + CYP3A4 inhibitors:\\r\\n⚠️ May increase systemic steroid effects if applied widely.\\r\"},{\"id\":\"rochetta-027\",\"title\":\"Fungal Skin Infections\",\"subtitle\":\"Tinea corporis, tinea pedis, candidiasis — dermatophytes \u0026 yeasts\",\"content\":\"[DIAGNOSIS]\\r\\n- Tinea corporis: Annular scaly plaque, central clearing\\r\\n- Tinea pedis: Interdigital maceration, scaling\\r\\n- Candidiasis: Satellite pustules, white curd\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Culture: KOH preparation of skin scraping (dermatophyte identification)\\r\\n- Special test: Fungal culture if KOH negative but suspicion high; Wood's lamp for tinea capitis\\r\\n- Lab: FBS if recurrent tinea (diabetes risk), HIV screen if widespread/refractory\\r\\n- Monitor: Treatment response at 2 weeks, adherence to topical therapy\\r\\n\\r\\n[TREATMENT]\\r\\n- Local (mild): Terbinafine or Clotrimazole cream × 1–2 wks\\r\\n- Widespread: Oral Terbinafine × 2–4 wks\\r\\n- Candidiasis: Nystatin or Clotrimazole cream\\r\\n\\r\\n[RX]\\r\\n- Terbinafine 1% cream (Terbinafine HCl) | طبقة رقيقة على المنطقة المصابة مرتين يوميًا × 1-2 أسبوع | 9.25 ج.م\\r\\n- OR Clotrimazole 1% cream (Clotrimazole) | طبقة رقيقة مرتين يوميًا × 2-4 أسابيع | 10 ج.م\\r\\n- Ketoconazole 2% shampoo (Ketoconazole) | شامبو على البشرة المصابة 3 مرات أسبوعيًا | 14.4 ج.م\\r\",\"category\":\"Dermatology\",\"chapterAr\":\"الأمراض الجلدية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Terbinafine 1% cream | 45 ج.م: Lamisil 1% cream | 120 ج.م, Terbinafine GPO 1% cream | 35 ج.م, Terbinafine Sandoz 1% cream | 30 ج.م\\r\\nClotrimazole 1% cream | 15 ج.م: Canesten 1% cream | 55 ج.م, Clotrimazole Arrow 1% cream | 12 ج.م, Clotrimazole GPO 1% cream | 10 ج.م\\r\\nKetoconazole 2% shampoo | 50 ج.م: Nizoral 2% shampoo | 130 ج.م, Ketoconazole GPO 2% shampoo | 40 ج.م, Ketoconazole Sandoz 2% shampoo | 35 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-028\",\"title\":\"Scabies\",\"subtitle\":\"Intense nocturnal pruritus — Sarcoptes scabiei mite\",\"content\":\"[DIAGNOSIS]\\r\\n- Intense itch worse at night\\r\\n- Burrows in web spaces, wrists, axillae\\r\\n- Secondary excoriation, impetiginization\\r\\n- Close contacts must be treated simultaneously\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Special test: Dermoscopy of burrows (triangle pattern); skin scraping for mite identification\\r\\n- Culture: Skin scraping in mineral oil — mite/eggs/ova on microscopy\\r\\n- Monitor: Resolution of itch at 2 weeks, household contact treatment compliance\\r\\n- Screen: Secondary impetiginisation (wound swab if pustular), scabies in contacts\\r\\n\\r\\n[TREATMENT]\\r\\n- Permethrin 5%: Apply from neck down, leave 8–12 hrs, wash off\\r\\n- Ivermectin: 200mcg/kg PO single dose — alternative\\r\\n- Treat ALL household contacts\\r\\n- Wash bedding/clothing at 60°C\\r\\n\\r\\n[RX]\\r\\n- Permethrin 5% cream (Permethrin) | يُطلّى من الرقب للقدم — يُترك 8-12 ساعة ثم يُغسل — كرر بعد أسبوع | 12 ج.م\\r\\n- OR Eurax 10% cream (Crotamiton) | بديل — يُطلّى 3 مرات × 24 ساعة لكل مرة | 8.5 ج.م\\r\\n- + Cetirizine 10mg tab (Cetirizine HCl) | قص مرة واحدة يوميًا للحكة | 19 ج.م\\r\",\"category\":\"Dermatology\",\"chapterAr\":\"الأمراض الجلدية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Permethrin 5% cream | 55 ج.م: Permethrin GPO 5% cream | 45 ج.م, Permethrin Sandoz 5% cream | 40 ج.م, Lyclear 5% cream | 100 ج.م\\r\\nEurax 10% cream (Crotamiton) | 40 ج.م: Crotamiton GPO 10% cream | 30 ج.م, Crotamiton Sandoz 10% cream | 25 ج.م, Eurax Hermal 10% cream | 85 ج.م\\r\\nCetirizine 10mg tab | 25 ج.م: Zyrtec 10mg tab | 80 ج.م, Cetirizine Arrow 10mg tab | 20 ج.م, Cetirizine GPO 10mg tab | 15 ج.م\\r\",\"drugInstructions\":\"⚠️ Permethrin: Apply from NECK DOWN — leave 8-12 hours, then wash off\\r\\n⚠️ REPEAT treatment after 1 WEEK — kills newly hatched mites\\r\\n⚠️ Treat ALL household contacts simultaneously\\r\\n⚠️ Wash all bedding/clothing at 60°C or dry clean\\r\\n⚠️ Eurax: Apply 3 times, leave 24h each time\\r\\n✅ Cetirizine: Take for itching\\r\\n⚠️ itching may continue for 2-4 weeks after successful treatment (allergic reaction to dead mites)\\r\\n⚠️ If still itching after 4 weeks, seek reassessment\\r\",\"drugInteractions\":\"Permethrin + Other topical products:\\r\\n⚠️ Wait for permethrin to dry before applying other products.\\r\\n\\r\\nIvermectin + Warfarin:\\r\\n⚠️ May increase INR. Monitor.\\r\\n\\r\\nIvermectin + CYP3A4 inducers (Carbamazepine):\\r\\n⚠️ Reduced Ivermectin effectiveness.\\r\"},{\"id\":\"rochetta-029\",\"title\":\"Acute Urticaria\",\"subtitle\":\"Raised, pruritic wheals — histamine-mediated hypersensitivity\",\"content\":\"[DIAGNOSIS]\\r\\n- Transient wheals lasting \u003c 24 hours each\\r\\n- Angioedema may coexist (lips, eyelids)\\r\\n- Causes: food, drugs, infections, idiopathic\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Special test: Skin prick testing if recurrent; tryptase level if anaphylaxis suspected\\r\\n- Lab: CBC (eosinophilia), thyroid function if chronic\\r\\n- Monitor: Response to antihistamine dose escalation, wheal frequency diary\\r\\n- Screen: Drug history review, infection screen if persistent \u003e 6 weeks\\r\\n\\r\\n[TREATMENT]\\r\\n- Step 1: 2nd-gen antihistamine: Cetirizine / Loratadine\\r\\n- Step 2: Double dose antihistamine (up to 4×)\\r\\n- Step 3: Add Montelukast 10mg\\r\\n- Step 4: Short course Prednisolone 40mg × 5 days\\r\\n\\r\\n[RX]\\r\\n- Cetirizine 10mg tab (Cetirizine HCl) | قص مرة واحدة يوميًا — 24 ساعة ضد الحكة | 19 ج.م\\r\\n- OR Loratadine 10mg tab (Loratadine) | قص مرة واحدة يوميًا — غير مسبب للنعاس | 21 ج.م\\r\\n- OR Prednisolone 20mg tab (Prednisolone) | جرعة متفاوتة 5 أيام فقط — حالات شديدة | 8 ج.م\\r\",\"category\":\"Dermatology\",\"chapterAr\":\"الأمراض الجلدية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Cetirizine 10mg tab | 25 ج.م: Zyrtec 10mg tab | 80 ج.م, Cetirizine Arrow 10mg tab | 20 ج.م, Cetirizine GPO 10mg tab | 15 ج.م\\r\\nLoratadine 10mg tab | 30 ج.م: Claritin 10mg tab | 85 ج.م, Loratadine Arrow 10mg tab | 25 ج.م, Loratadine GPO 10mg tab | 20 ج.م\\r\\nPrednisolone 20mg tab | 20 ج.م: Prednisolone Arrow 20mg tab | 15 ج.م, Prednisolone GPO 20mg tab | 12 ج.م, Deltacortril 20mg tab | 45 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-030\",\"title\":\"Psoriasis\",\"subtitle\":\"Chronic, relapsing — well-demarcated scaly plaques\",\"content\":\"[DIAGNOSIS]\\r\\n- Silvery-white scale on erythematous plaques\\r\\n- Extensor surfaces (elbows, knees), scalp\\r\\n- Auspitz sign (pinpoint bleeding on scale removal)\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Lab: FBS, LFTs, lipids — baseline before systemic therapy (MTX, cyclosporine)\\r\\n- Special test: PASI score (severity), DLQI (quality of life); consider skin biopsy if atypical\\r\\n- Monitor: PASI score response, weight, BP on cyclosporine; FBC/LFTs on MTX\\r\\n- Screen: Psoriatic arthritis (joint exam), cardiovascular risk, depression\\r\\n\\r\\n[TREATMENT]\\r\\n- Mild (\u003c 10%): Topical: Calcipotriol + Betamethasone\\r\\n- Moderate: Phototherapy (NB-UVB)\\r\\n- Severe: Methotrexate / Cyclosporine\\r\\n- Biologics: Adalimumab / Secukinumab (refractory)\\r\\n\\r\\n[RX]\\r\\n- Calcipotriol + Betamethasone cream (Dovobet) | طبقة رقيقة مرة واحدة يوميًا × 4 أسابيع | —\\r\\n- Salicylic acid + Coal tar ointment (KC 25 / Scytera) | يُطلّى على اللويحات مرتين يوميًا | —\\r\",\"category\":\"Dermatology\",\"chapterAr\":\"الأمراض الجلدية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Calcipotriol+Betamethasone cream (Dovobet) | 200 ج.م: Psorax cream | 150 ج.م, Calcipotriol+Betamethasone Sandoz | 180 ج.م, Xamiol gel | 250 ج.م\\r\\nSalicylic acid+Coal tar ointment | 35 ج.م: Exorex cream | 120 ج.م, Coal tar solution | 25 ج.م, Sebco ointment | 40 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-031\",\"title\":\"Bacterial Skin Infections\",\"subtitle\":\"Impetigo, cellulitis, folliculitis — common pyodermas\",\"content\":\"$21\",\"category\":\"Dermatology\",\"chapterAr\":\"الأمراض الجلدية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Mupirocin 2% ointment | 80 ج.م: Bactroban 2% ointment | 180 ج.م, Mupirocin GPO 2% ointment | 65 ج.م, Mupirocin Sandoz 2% ointment | 55 ج.م\\r\\nFusidic acid 2% cream | 60 ج.م: Fucidin 2% cream | 150 ج.م, Fusidic acid GPO 2% cream | 50 ج.م, Fusidic acid Sandoz 2% cream | 45 ج.م\\r\\nCephalexin 500mg cap | 30 ج.م: Keflex 500mg cap | 100 ج.م, Cephalexin Arrow 500mg cap | 25 ج.م, Cephalexin GPO 500mg cap | 22 ج.م\\r\\nAmoxicillin 1g tab | 30 ج.م: Amoxil 1g tab | 75 ج.م, Ospamox 1g tab | 80 ج.م, Amoxicillin Arrow 1g tab | 25 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-032\",\"title\":\"Hirsutism \u0026 Alopecia\",\"subtitle\":\"Excess hair growth in females — hormonal vs idiopathic\",\"content\":\"[DIAGNOSIS]\\r\\n- Ferriman-Gallwey score ≥ 8 = hirsutism\\r\\n- Investigate: testosterone, DHEAS, LH/FSH ratio (PCOS)\\r\\n- Sudden onset → ovarian/adrenal tumour → urgent work-up\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Lab: Total testosterone, free testosterone, DHEAS, LH/FSH ratio, 17-OHP\\r\\n- Special test: Pelvic USS (PCOS, ovarian tumour); adrenal CT if DHEAS elevated\\r\\n- Monitor: Ferriman-Gallwey score, menstrual cycle regularity, side effects of anti-androgens\\r\\n- ECG: Baseline if on spironolactone (hyperkalaemia risk with ACEi)\\r\\n\\r\\n[TREATMENT]\\r\\n- Cyproterone (Diane-35): 1st-line for hirsutism in females\\r\\n- Spironolactone: 50–100mg — anti-androgen\\r\\n- Minoxidil 5%: Topical — for androgenic alopecia\\r\\n\\r\\n[RX]\\r\\n- Diane-35 tab (Cyproterone + Ethinylestradiol) | قص واحدة يوميًا × 21 يوم — ثم 7 أيام راحة | —\\r\\n- OR Aldactone 25mg tab (Spironolactone) | قص مرتين يوميًا — مضاد أندروجين | 18 ج.م\\r\",\"category\":\"Dermatology\",\"chapterAr\":\"الأمراض الجلدية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Diane-35 tab | 120 ج.م: Cyproterone+Ethinyl Arrow | 80 ج.م, Diane 35 GPO | 100 ج.م, Chloe 35 tab | 150 ج.م\\r\\nAldactone 25mg tab | 50 ج.م: Spironolactone Arrow 25mg tab | 35 ج.م, Spironolactone GPO 25mg tab | 30 ج.م, Spirotone 25mg tab | 65 ج.م\\r\",\"drugInstructions\":\"\",\"drugInteractions\":\"\"},{\"id\":\"rochetta-033\",\"title\":\"Herpes Zoster\",\"subtitle\":\"Unilateral dermatomal vesicular rash — VZV reactivation\",\"content\":\"$22\",\"category\":\"Dermatology\",\"chapterAr\":\"الأمراض الجلدية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Virless 800mg tab (Acyclovir) | 45 ج.م: Aclovir 800mg tab | 40 ج.م, Zovirax 800mg tab | 55 ج.م, Famciclovir 500mg tab | 180 ج.م\\r\\nCalamine lotion | 20 ج.م: Caladryl lotion | 18 ج.م, Calamyl lotion | 16 ج.م\\r\\nLyrica 75mg cap (Pregabalin) | 130 ج.م: Pregalin 75mg cap | 70 ج.م, Sorelia 75mg cap | 75 ج.م, Pregabex 75mg cap | 65 ج.م\\r\",\"drugInstructions\":\"⚠️ Start antivirals within 72 hours of rash onset\\r\\n✅ Acyclovir: take with plenty of water after food\\r\\n⚠️ Keep vesicles clean and dry — do NOT scratch\\r\\n⚠️ Avoid alcohol while on Pregabalin\\r\\n✅ Calamine: apply to unbroken skin only\\r\",\"drugInteractions\":\"Acyclovir + Nephrotoxic drugs (NSAIDs, Aminoglycosides):\\r\\n⚠️ Ensure hydration and monitor renal function.\\r\\n\\r\\nPregabalin + CNS depressants (Alcohol, Opioids):\\r\\n⚠️ Additive sedation and dizziness — avoid combination.\\r\"},{\"id\":\"rochetta-034\",\"title\":\"Herpes Simplex\",\"subtitle\":\"Grouped vesicles — orolabial (HSV-1) or genital (HSV-2)\",\"content\":\"$23\",\"category\":\"Dermatology\",\"chapterAr\":\"الأمراض الجلدية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Zovirax 200mg tab (Acyclovir) | 35 ج.م: Aclovir 200mg tab | 30 ج.م, Zovirax 400mg tab | 45 ج.م, Acyclovir GPO 200mg tab | 18 ج.م\\r\\nZovirax cream (Acyclovir 5%) | 28 ج.م: Virless cream | 25 ج.م, Acyclovir 5% cream | 22 ج.م\\r\\nValcyclor 500mg tab (Valacyclovir) | 150 ج.م: Valtrex 500mg tab | 220 ج.م, Valacyclovir 500mg tab | 140 ج.م\\r\",\"drugInstructions\":\"⚠️ Start at first tingling (prodrome) — fastest response\\r\\n✅ Acyclovir: take with water, can be taken after meals\\r\\n⚠️ Keep lesions clean and dry — avoid touching eyes\\r\\n⚠️ Wash hands after touching lesions\\r\\n⚠️ Suppressive therapy if attacks are frequent (\u003e6/year)\\r\",\"drugInteractions\":\"Acyclovir + Nephrotoxic drugs (NSAIDs, Aminoglycosides):\\r\\n⚠️ Ensure hydration and monitor renal function — especially IV forms.\\r\\n\\r\\nAcyclovir + Probenecid:\\r\\n⚠️ Reduced renal clearance of acyclovir — adjust dose in renal impairment.\\r\"},{\"id\":\"rochetta-035\",\"title\":\"Contact Dermatitis\",\"subtitle\":\"Delayed (allergic) or immediate (irritant) skin reaction at contact site\",\"content\":\"$24\",\"category\":\"Dermatology\",\"chapterAr\":\"الأمراض الجلدية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Betnovate cream (Betamethasone 0.1%) | 22 ج.م: Betnovate N cream | 26 ج.م, Betaval cream | 18 ج.م, Celestone cream | 20 ج.م\\r\\nZyrtec 10mg tab (Cetirizine) | 25 ج.م: Histec 10mg tab | 15 ج.م, Cetall 10mg tab | 20 ج.م, Reactin 10mg tab | 28 ج.م\\r\\nPhysiogel cream (Emollient) | 180 ج.م: Cetaphil cream | 300 ج.م, CeraVe moisturizing cream | 420 ج.م, Skincap cream | 90 ج.م\\r\\nDermovate cream (Clobetasol 0.05%) | 35 ج.م: Colvasone cream | 28 ج.م, Dermovate scalp lotion | 40 ج.م\\r\",\"drugInstructions\":\"✅ Betnovate: apply thin layer to affected areas only — twice daily\\r\\n⚠️ Do NOT use topical steroid beyond 7 days on face/flexures\\r\\n✅ Zyrtec: take in the evening for itching\\r\\n✅ Emollients: apply generously, multiple times daily\\r\\n⚠️ Identify and remove the offending contact substance\\r\",\"drugInteractions\":\"Betamethasone (Topical) + Occlusion / Prolonged use:\\r\\n⚠️ Skin atrophy, telangiectasia, striae — limit potent steroid to 7 days.\\r\\n\\r\\nPotent steroid + Face / Flexures:\\r\\n⚠️ Rebound and worsening — avoid long courses; use mild steroid instead.\\r\"},{\"id\":\"rochetta-036\",\"title\":\"Seborrheic Dermatitis\",\"subtitle\":\"Greasy yellow scaly patches — scalp, face, chest\",\"content\":\"[DIAGNOSIS]\\r\\n- Greasy yellow scaly patches — scalp, nasolabial folds, eyebrows, chest\\r\\n- Chronic relapsing course — worse in winter and stress\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Special test: KOH preparation / fungal microscopy of scales (Malassezia)\\r\\n- Culture: Fungal culture if atypical or unresponsive\\r\\n- Lab: HIV screen if severe, refractory adult case\\r\\n- Monitor: Response to antifungal therapy, adherence, recurrence frequency\\r\\n\\r\\n[TREATMENT]\\r\\n- Antifungal shampoo/cream (Malassezia role)\\r\\n- Mild topical steroid for inflamed areas — short-term\\r\\n\\r\\n[WARNING]\\r\\nSevere/refractory cases in adults — consider HIV screening.\\r\\n\\r\\n[RX-الروشتة — Scalp/Face]\\r\\n- Nizoral shampoo 2% (Ketoconazole) | بدل الشامبو العادي مرتين أسبوعيًا — يترك 5 دقائق ثم يغسل | 90 ج.م ⚠ Verify price\\r\\n- Ketoderm cream (Ketoconazole 2%) | مرة يوميًا على الوجه × أسبوعين | 30 ج.م ⚠ Verify price\\r\\n- Mycolog cream (Hydrocortisone) | مرة يوميًا للمناطق الملتهبة فقط — لا يزيد عن أسبوع | 25 ج.م ⚠ Verify price\\r\",\"category\":\"Dermatology\",\"chapterAr\":\"الأمراض الجلدية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Nizoral shampoo 2% (Ketoconazole) | 90 ج.م: Dandrex shampoo | 45 ج.م, Ketofungol shampoo | 55 ج.م, Nizoral 2% gel | 95 ج.م\\r\\nKetoderm cream (Ketoconazole 2%) | 30 ج.م: Nizoral cream | 75 ج.م, Ketoconazole 2% cream | 25 ج.م\\r\\nMycolog cream (Hydrocortisone) | 25 ج.م: Hydrocortisone 1% cream | 8 ج.م, Locoid cream | 45 ج.م\\r\",\"drugInstructions\":\"✅ Nizoral: use twice weekly instead of normal shampoo — leave 5 min before rinsing\\r\\n✅ Ketoderm: apply once daily to face for 2 weeks\\r\\n⚠️ Mycolog (hydrocortisone): inflamed areas only — max 7 days\\r\\n⚠️ Wash skin with mild cleanser; avoid oily cosmetics\\r\\n⚠️ Refractory/severe adult cases: screen for HIV\\r\",\"drugInteractions\":\"Ketoconazole shampoo + Contact lenses:\\r\\n⚠️ Remove lenses before use; can irritate eyes.\\r\\n\\r\\nTopical Hydrocortisone + Face/Flexures prolonged use:\\r\\n⚠️ Skin thinning and telangiectasia — limit to 1 week.\\r\"},{\"id\":\"rochetta-037\",\"title\":\"Vitiligo\",\"subtitle\":\"Depigmented chalk-white macules — autoimmune destruction of melanocytes\",\"content\":\"$25\",\"category\":\"Dermatology\",\"chapterAr\":\"الأمراض الجلدية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Protopic 0.1% oint (Tacrolimus) | 210 ج.م: Protopic 0.03% oint | 190 ج.م, Tacrinic 0.1% oint | 230 ج.م, Elidel cream 1% | 160 ج.م\\r\\nDermovate cream (Clobetasol 0.05%) | 35 ج.م: Colvasone cream | 28 ج.م, Clobex cream | 45 ج.م\\r\\nSunblock SPF 50 | 150 ج.م: Ureadin Solar cream | 180 ج.م, La Roche-Posay SPF 50 | 320 ج.م, Eucerin SPF 50 | 260 ج.م\\r\",\"drugInstructions\":\"✅ Protopic: apply thin layer — preferably at night; safe for face\\r\\n⚠️ Clobetasol: not for the face long-term — max 4 weeks\\r\\n✅ Sunscreen SPF 50 daily on all depigmented exposed areas\\r\\n⚠️ Expect slow response — repigmentation takes months\\r\\n⚠️ Screen thyroid function (anti-TPO) — autoimmune association\\r\",\"drugInteractions\":\"Tacrolimus topical + Sun exposure:\\r\\n⚠️ Minimize UV exposure — apply sunscreen; photosensitivity risk.\\r\\n\\r\\nClobetasol + Prolonged use (face/flexures):\\r\\n⚠️ Skin atrophy and telangiectasia — restrict to 1 month.\\r\"},{\"id\":\"rochetta-038\",\"title\":\"Viral Warts (Verruca)\",\"subtitle\":\"HPV-mediated hyperkeratotic papules — common, plantar, flat\",\"content\":\"[DIAGNOSIS]\\r\\n- Rough, hyperkeratotic papules — common (hands), plantar, or flat warts\\r\\n- HPV-mediated — thrombosed capillaries appear as black dots on paring\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Special test: Clinical diagnosis on inspection and paring (thrombosed capillaries)\\r\\n- Biopsy: Skin biopsy if atypical lesion, pigmented lesion, or non-response to treatment\\r\\n- Monitor: Lesion count and size, response to salicylic acid (weeks of application)\\r\\n- Screening: Immunosuppression screen if many/rapidly spreading warts\\r\\n\\r\\n[TREATMENT]\\r\\n- Topical salicylic acid — first line, needs weeks of application\\r\\n- Cryotherapy for resistant lesions (referral if unavailable)\\r\\n\\r\\n[WARNING]\\r\\nAvoid salicylic acid on the face or on diabetic/ischemic feet.\\r\\n\\r\\n[RX-الروشتة — Standard]\\r\\n- Verrumal solution (Salicylic acid + 5-FU) | يوضع على الثؤلول يوميًا مساءً بعد نقعه في الماء الدافئ — يحمي الجلد السليم | 55 ج.م ⚠ Verify price\\r\",\"category\":\"Dermatology\",\"chapterAr\":\"الأمراض الجلدية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Verrumal solution (Salicylic acid + 5-FU) | 55 ج.م: Duofilm solution | 35 ج.م, Verrux solution | 40 ج.م, Salicylic acid 26% solution | 30 ج.م\\r\",\"drugInstructions\":\"✅ Apply nightly after soaking wart in warm water for 5 minutes\\r\\n⚠️ Protect surrounding normal skin when applying\\r\\n⚠️ Avoid on face or diabetic/ischemic feet\\r\\n✅ Continue for several weeks — requires persistence\\r\\n✅ See referral for cryotherapy if resistant\\r\",\"drugInteractions\":\"5-FU (Verrumal) + Pregnancy:\\r\\n⚠️ Contraindicated — avoid use during pregnancy/breastfeeding.\\r\\n\\r\\nSalicylic acid + Surrounding normal skin:\\r\\n⚠️ Protect healthy skin — apply to wart only to prevent chemical burn.\\r\"},{\"id\":\"rochetta-039\",\"title\":\"Rosacea\",\"subtitle\":\"Central facial erythema, telangiectasia, papulopustules\",\"content\":\"[DIAGNOSIS]\\r\\n- Central facial erythema, telangiectasia, papulopustules — no comedones (vs acne)\\r\\n- Triggers: sun, heat, spicy food, alcohol\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Culture: Skin swab if pustules present (exclude bacterial folliculitis)\\r\\n- Special test: Demodex mite assessment (Dermoscopy / skin scraping)\\r\\n- Monitor: Erythema score, papulopustule count, response to doxycycline course\\r\\n- Screen: Ocular involvement (blepharitis), hormonal profile if female (PCOS association)\\r\\n\\r\\n[TREATMENT]\\r\\n- Trigger avoidance + daily sunscreen — cornerstone\\r\\n- Topical for mild-moderate; oral for moderate-severe papulopustular\\r\\n\\r\\n[WARNING]\\r\\nAvoid topical steroids — they worsen / cause rebound rosacea.\\r\\n\\r\\n[RX-الروشتة — Papulopustular]\\r\\n- Metrogyl gel 0.75% (Metronidazole) | مرتين يوميًا على الوجه | 25 ج.م ⚠ Verify price\\r\\n- Doxycycline 100mg cap (Doxycycline) | كبسولة يوميًا مع الطعام × 8-12 أسبوع | 12 ج.م ⚠ Verify price\\r\",\"category\":\"Dermatology\",\"chapterAr\":\"الأمراض الجلدية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Metrogyl gel 0.75% (Metronidazole) | 25 ج.م: Rozex gel 0.75% | 60 ج.م, Metronidazole gel | 22 ج.م, Metrocream 1% | 30 ج.م\\r\\nDoxycycline 100mg cap (Doxycycline) | 12 ج.م: Vibramycin 100mg cap | 25 ج.م, Doxy 100mg cap | 12 ج.م, Dorix 100mg cap | 10 ج.م\\r\",\"drugInstructions\":\"✅ Metrogyl gel: apply twice daily to affected facial areas\\r\\n✅ Doxycycline: take with food; avoid sun exposure\\r\\n⚠️ Space antacids/dairy 2-4 hours from doxycycline\\r\\n⚠️ NEVER use topical steroids on rosacea — causes rebound\\r\\n✅ Daily sunscreen SPF 30+ and avoid triggers\\r\",\"drugInteractions\":\"Doxycycline + Antacids/Iron/Calcium/Dairy:\\r\\n⚠️ Reduced absorption. Space 2-4 hours.\\r\\n\\r\\nMetronidazole gel + Alcohol:\\r\\n⚠️ Minimal systemic absorption, but avoid heavy alcohol intake with oral forms.\\r\"},{\"id\":\"rochetta-040\",\"title\":\"Hypertension\",\"subtitle\":\"BP ≥ 140/90 mmHg on repeated measurements — most common CV risk factor\",\"content\":\"$26\",\"category\":\"Cardiovascular\",\"chapterAr\":\"القلب والأوعية الدموية\",\"alternatives\":\"Amlodipine 5mg tab | 18 ج.م\\nLosartan 50mg tab | 35 ج.م\\nEnalapril 10mg tab | 15 ج.م\\nAtenolol 50mg tab | 12 ج.م\",\"perDrugAlternatives\":\"Amlodipine 5mg tab | 18 ج.م: Norvasc 5mg tab | 45 ج.م, Stamlo 5mg tab | 15 ج.م, Amlodac 5mg tab | 12 ج.م\\nLosartan 50mg tab | 35 ج.م: Cozaar 50mg tab | 65 ج.م, Losacar 50mg tab | 28 ج.م, Lozart 50mg tab | 22 ج.م\\nEnalapril 10mg tab | 15 ج.م: Renitec 10mg tab | 25 ج.م, Enapril 10mg tab | 12 ج.م, Vasolapril 10mg tab | 10 ج.م\\nAtenolol 50mg tab | 12 ج.م: Tenormin 50mg tab | 30 ج.م, Aten 50mg tab | 10 ج.م, Atcardil 50mg tab | 8 ج.م\",\"drugInstructions\":\"⚠️ Take at the same time every day\\r\\n⚠️ Ramipril: Start with 2.5mg, titrate gradually\\r\\n⚠️ Do NOT use potassium supplements unless prescribed\\r\\n⚠️ Report persistent dry cough (ACE inhibitor side effect — switch to ARB)\\r\\n✅ All can be taken with or without food\\r\\n⚠️ Monitor blood pressure regularly at home\\r\\n⚠️ Report dizziness when standing up\\r\\n❌ Do NOT stop suddenly — BP may rebound dangerously\\r\\n❌ Avoid excess salt — undermines medication effect\\r\",\"drugInteractions\":\"ACE Inhibitors (Ramipril) + ARBs (Losartan):\\r\\n❌ NEVER combine — dual RAAS blockade increases hyperkalemia and renal failure without benefit.\\r\\n\\r\\nACE Inhibitors + Potassium-sparing diuretics (Spironolactone):\\r\\n⚠️ Hyperkalemia risk. Monitor K+ and renal function.\\r\\n\\r\\nACE Inhibitors + NSAIDs:\\r\\n⚠️ Reduced BP control + renal damage (\\\"Triple Whammy\\\" with diuretics — avoid in elderly).\\r\"},{\"id\":\"rochetta-041\",\"title\":\"Stable Angina\",\"subtitle\":\"Chest pain on exertion, relieved by rest/nitroglycerin — myocardial ischemia\",\"content\":\"$27\",\"category\":\"Cardiovascular\",\"chapterAr\":\"القلب والأوعية الدموية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Bisoprolol 5mg tab | 20 ج.م: Concor 5mg tab | 75 ج.م, Bisoprolol Arrow 5mg tab | 15 ج.م, Bisoprolol Sandoz 5mg tab | 12 ج.م\\r\\nAspirin 75mg tab | 8 ج.م: Aspirin Bayer 75mg | 20 ج.م, Aspirin GPO 75mg tab | 6 ج.م, Aspirin Sandoz 75mg tab | 5 ج.م\\r\\nAtorvastatin 20mg tab | 40 ج.م: Lipitor 20mg tab | 150 ج.م, Atorvastatin Arrow 20mg tab | 35 ج.م, Atorvastatin GPO 20mg tab | 30 ج.م\\r\\nNitroglycerin sublingual | 25 ج.م: Nitrolingual spray | 90 ج.م, GTN 0.4mg tab | 55 ج.م, Nitrostat 0.4mg tab | 120 ج.م\\r\",\"drugInstructions\":\"⚠️ Bisoprolol: Take in the morning — do NOT stop suddenly\\r\\n⚠️ Atorvastatin: Take at bedtime\\r\\n⚠️ Aspirin: Take with food to protect stomach\\r\\n⚠️ GTN: Sit down before using. 1 puff under tongue, repeat every 5 min × 3 max\\r\\n⚠️ If chest pain persists after 3 GTN doses → call ambulance (possible MI)\\r\\n✅ Aspirin 75mg: Lifelong for secondary prevention\\r\\n⚠️ Report muscle pain/weakness on statins\\r\\n❌ Do NOT stop Beta-blocker suddenly — rebound angina/MI risk\\r\",\"drugInteractions\":\"Beta-blockers (Bisoprolol) + Verapamil/Diltiazem:\\r\\n❌ Severe bradycardia, AV block, heart failure.\\r\\n\\r\\nStatins (Atorvastatin) + Macrolides (Clarithromycin):\\r\\n❌↑↑ Rhabdomyolysis risk. Stop statin during antibiotic course.\\r\\n\\r\\nStatins + Fibrates (Gemfibrozil):\\r\\n⚠️↑ Myopathy risk. Prefer Fenofibrate.\\r\\n\\r\\nAspirin + Warfarin:\\r\\n⚠️↑ Bleeding risk. Only combine under specialist supervision.\\r\"},{\"id\":\"rochetta-042\",\"title\":\"Heart Failure\",\"subtitle\":\"Dyspnea, edema, fatigue — reduced ejection fraction (HFrEF)\",\"content\":\"$28\",\"category\":\"Cardiovascular\",\"chapterAr\":\"القلب والأوعية الدموية\",\"alternatives\":\"Lasix 40mg tab | 8 ج.م\\nCarvedilol 12.5mg tab | 55 ج.م\\nRamipril 5mg tab | 42 ج.م\\nSpironolactone 25mg tab | 18 ج.م\",\"perDrugAlternatives\":\"Furosemide 40mg tab | 8 ج.م: Lasix 40mg tab | 8 ج.م, Furosemide Sanofi 40mg tab | 6 ج.م, Dryptal 40mg tab | 5 ج.م\\nCarvedilol 12.5mg tab | 55 ج.م: Coreg 12.5mg tab | 85 ج.م, Cardivas 12.5mg tab | 40 ج.م, Carvil 12.5mg tab | 35 ج.م\\nRamipril 5mg tab | 42 ج.م: Altace 5mg tab | 75 ج.م, Delix 5mg tab | 55 ج.م, Ramcard 5mg tab | 30 ج.م\\nSpironolactone 25mg tab | 18 ج.م: Aldactone 25mg tab | 25 ج.م, Spiractin 25mg tab | 15 ج.م, Spiresis 25mg tab | 12 ج.م\",\"drugInstructions\":\"⚠️ Weigh yourself DAILY — report gain \u003e2kg in a week\\r\\n⚠️ Ramipril: Start low, titrate slowly\\r\\n⚠️ Carvedilol: Take WITH food\\r\\n⚠️ Furosemide: Take in the MORNING — avoid nighttime urination\\r\\n⚠️ Limit salt to \u003c6g/day\\r\\n⚠️ Limit fluid intake to 1.5-2L/day if instructed\\r\\n❌ Do NOT stop Beta-blocker suddenly\\r\\n❌ Do NOT take NSAIDs (Ibuprofen) — worsens HF\\r\\n⚠️ Report worsening breathlessness, increased swelling, or weight gain immediately\\r\",\"drugInteractions\":\"ACE Inhibitors + Spironolactone:\\r\\n⚠️↑ Hyperkalemia risk. Monitor K+ regularly.\\r\\n\\r\\nFurosemide + Digoxin:\\r\\n⚠️ Hypokalemia from Furosemide increases Digoxin toxicity. Monitor K+.\\r\\n\\r\\nSpironolactone + Potassium supplements:\\r\\n❌ Severe hyperkalemia. Avoid K+ supplements.\\r\\n\\r\\nACE Inhibitors + NSAIDs:\\r\\n⚠️ Reduced efficacy + worsened renal function. Avoid.\\r\"},{\"id\":\"rochetta-043\",\"title\":\"Atrial Fibrillation\",\"subtitle\":\"Irregularly irregular pulse — rate vs rhythm control\",\"content\":\"$29\",\"category\":\"Cardiovascular\",\"chapterAr\":\"القلب والأوعية الدموية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Bisoprolol 5mg tab | 20 ج.م: Concor 5mg tab | 75 ج.م, Bisoprolol Arrow 5mg tab | 15 ج.م, Bisoprolol GPO 5mg tab | 12 ج.م\\r\\nDigoxin 0.25mg tab | 15 ج.م: Lanoxin 0.25mg tab | 45 ج.م, Digoxin Arrow 0.25mg tab | 12 ج.م, Digoxin GPO 0.25mg tab | 10 ج.م\\r\\nRivaroxaban 20mg tab | 350 ج.م: Xarelto 20mg tab | 650 ج.م, Rivaroxaban Arrow 20mg tab | 300 ج.م, Rivaroxaban Sandoz 20mg tab | 280 ج.م\\r\\nApixaban 5mg tab | 400 ج.م: Eliquis 5mg tab | 750 ج.م, Apixaban Arrow 5mg tab | 350 ج.م, Apixaban Sandoz 5mg tab | 320 ج.م\\r\\nWarfarin 5mg tab | 12 ج.م: Coumadin 5mg tab | 50 ج.م, Warfarin Arrow 5mg tab | 10 ج.م, Warfarin GPO 5mg tab | 8 ج.م\\r\",\"drugInstructions\":\"⚠️ Warfarin: Same time daily. Regular INR monitoring (target 2-3)\\r\\n⚠️ Rivaroxaban: Take WITH food\\r\\n⚠️ Apixaban: Can be taken with or without food\\r\\n⚠️ Report ANY signs of bleeding: unusual bruising, blood in urine/stool\\r\\n⚠️ Maintain CONSISTENT diet — changes in Vitamin K affect Warfarin\\r\\n✅ Take at the same time daily\\r\\n⚠️ If you miss DOAC dose: take if \u003c12h late (Apixaban) or \u003c6h (Rivaroxaban)\\r\\n❌ Do NOT stop anticoagulation without specialist advice — stroke risk\\r\\n⚠️ Wear medical alert bracelet on Warfarin\\r\\n⚠️ Inform ALL healthcare providers about anticoagulation before procedures\\r\",\"drugInteractions\":\"Warfarin + NSAIDs:\\r\\n❌↑↑ Bleeding risk. Use Paracetamol instead.\\r\\n\\r\\nWarfarin + Amiodarone:\\r\\n❌↑↑ Significantly increased INR. Reduce Warfarin 30-50% and monitor INR.\\r\\n\\r\\nWarfarin + Antibiotics (Metronidazole, Ciprofloxacin):\\r\\n⚠️↑ INR increases. Monitor INR every 3-5 days during course.\\r\\n\\r\\nDOACs + Strong CYP3A4 inhibitors (Ketoconazole, Ritonavir):\\r\\n⚠️↑↑ Drug levels and bleeding risk. Avoid.\\r\\n\\r\\nDOACs + Strong CYP3A4 inducers (Rifampin, Carbamazepine):\\r\\n❌↓↓ Reduced efficacy → thrombosis. Avoid.\\r\\n\\r\\nBeta-blockers + Verapamil/Diltiazem:\\r\\n❌ Severe bradycardia and heart block.\\r\"},{\"id\":\"rochetta-044\",\"title\":\"Dyslipidemia\",\"subtitle\":\"Elevated LDL / Triglycerides — cardiovascular risk reduction\",\"content\":\"[DIAGNOSIS]\\r\\n- Low CV risk: LDL \u003c 3.0 mmol/L\\r\\n- Moderate risk: LDL \u003c 2.0 mmol/L\\r\\n- High risk (DM, PAD): LDL \u003c 1.8 mmol/L\\r\\n- Very high (AMI, stroke): LDL \u003c 1.4 mmol/L\\r\\n\\r\\n[INVESTIGATIONS]\\r\\n- Lab: Fasting lipid profile (LDL, HDL, triglycerides), LFTs baseline before statin, renal function\\r\\n- Special test: CV risk calculation (SCORE2/QRISK); HbA1c/FBS to exclude DM\\r\\n- Monitor: LFTs 3 months after starting statin, then annually; lipid profile on target\\r\\n- Screen: Rule out secondary dyslipidemia (hypothyroidism, diabetes, nephrotic syndrome)\\r\\n\\r\\n[TREATMENT]\\r\\n- Atorvastatin: Most potent — 20–80mg\\r\\n- Ezetimibe: Add-on to statin for extra LDL reduction\\r\\n- Fenofibrate: First choice for triglycerides \u003e 500\\r\\n- Check LFTs before starting\\r\\n\\r\\n[RX]\\r\\n- Atorvastatin 20mg tab (Atorvastatin Calcium) | قرص مرة واحدة يوميًا قبل النوم | 31 ج.م\\r\\n- Ezetimibe 10mg tab (Ezetimibe) | قرص مرة واحدة يوميًا — يخفض LDL إضافيًا | 95 ج.م\\r\\n- Fenofibrate 160mg tab (Fenofibrate) | قرص مرة واحدة يوميًا مع الطعام — للدهون الثلاثية | 35 ج.م\\r\",\"category\":\"Cardiovascular\",\"chapterAr\":\"القلب والأوعية الدموية\",\"alternatives\":\"\",\"perDrugAlternatives\":\"Atorvastatin 20mg tab | 40 ج.م: Lipitor 20mg tab | 150 ج.م, Atorvastatin Arrow 20mg tab | 35 ج.م, Atorvastatin GPO 20mg tab | 30 ج.م\\r\\nEzetimibe 10mg tab | 95 ج.م: Ezetrol 10mg tab | 180 ج.م, Ezetimibe Arrow 10mg tab | 75 ج.م, Ezetimibe GPO 10mg tab | 60 ج.م\\r\\nFenofibrate 160mg tab | 35 ج.م: Lipidil 160mg tab | 85 ج.م, Fenofibrate Arrow 160mg tab | 28 ج.م, Tricor 160mg tab | 110 ج.م\\r\",\"drugInstructions\":\"⚠️ Take at the same time daily\\r\\n⚠️ Atorvastatin: Take at bedtime\\r\\n⚠️ Ezetimibe: Can be taken any time — with or without food\\r\\n⚠️ Fenofibrate: Take with food for best absorption\\r\\n⚠️ Report unexplained muscle pain (rhabdomyolysis risk)\\r\\n✅ Take with or without food\\r\\n❌ Avoid large quantities of grapefruit juice\\r\\n⚠️ If on Clarithromycin: temporarily stop statin\",\"drugInteractions\":\"Statins + Macrolides (Clarithromycin):\\r\\n❌↑↑ Rhabdomyolysis risk. Stop statin during Clarithromycin course.\\r\\n\\r\\nStatins + Fibrates (Gemfibrozil):\\r\\n⚠️↑↑ Myopathy risk. Prefer Fenofibrate over Gemfibrozil.\\r\\n\\r\\nFenofibrate + Bile Acid Sequestrants:\\r\\n⚠️ Fenofibrate absorpti
